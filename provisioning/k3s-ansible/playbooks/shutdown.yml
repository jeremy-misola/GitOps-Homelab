---
- name: Stop k3s agents
  hosts: agent
  become: true
  gather_facts: false
  tasks:
    - name: Stop k3s-agent service
      ansible.builtin.systemd:
        name: k3s-agent
        state: stopped

- name: Stop k3s servers
  hosts: server
  become: true
  gather_facts: false
  serial: 1
  tasks:
    - name: Stop k3s service
      ansible.builtin.systemd:
        name: k3s
        state: stopped

- name: Power off all nodes (optional)
  hosts: k3s_cluster
  become: true
  gather_facts: false
  tasks:
    - name: Power off
      ansible.builtin.command: poweroff
      async: 1
      poll: 0
      when: poweroff | default(false) | bool
