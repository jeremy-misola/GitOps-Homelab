---
k3s_cluster:
  children:
    server:
      hosts:
        192.168.0.210:
        192.168.0.211:
        192.168.0.212:
    agent:
      hosts:
        192.168.0.213:
        192.168.0.214:
        192.168.0.215:

  vars:
    ansible_port: 22
    ansible_user: jurassicjey
    k3s_version: v1.31.12+k3s1
    api_endpoint: "{{ hostvars[groups['server'][0]]['ansible_host'] | default(groups['server'][0]) }}"
    cluster_context: prod-k3s
    extra_server_args: "--disable=traefik --disable=servicelb --disable=local-storage"
    extra_agent_args: ""
