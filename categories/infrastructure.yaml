apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure-helm
  namespace: argocd
spec:
  generators:
  - git:
      repoURL: https://github.com/jeremy-misola/GitOps-Homelab
      revision: develop
      files:
        - path: argocd-apps/infrastructure/**/*-helm-app.yaml
  template:
    metadata:
      name: '{{name}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{syncWave}}'
    spec:
      project: default
      source:
        repoURL: '{{repoURL}}'
        chart: '{{chart}}'
        targetRevision: '{{targetRevision}}'
        helm:
          values: |
            {{values}}
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
      # Infrastructure apps depend on base services (cert-manager, external-secrets)
      # but some apps might not need all dependencies - using shared-git as a safe base
      ignoreDifferences:
        - group: argoproj.io
          kind: ApplicationSet
          jsonPointers:
            - /status
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure-git
  namespace: argocd
spec:
  generators:
  - git:
      repoURL: https://github.com/jeremy-misola/GitOps-Homelab
      revision: develop
      files:
        - path: argocd-apps/infrastructure/**/*-git-app.yaml
  template:
    metadata:
      name: '{{name}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{syncWave}}'
    spec:
      project: default
      source:
        repoURL: '{{repoURL}}'
        targetRevision: '{{targetRevision}}'
        path: '{{appPath}}'
        directory:
          recurse: true
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
      # Infrastructure apps depend on base services (cert-manager, external-secrets)
      # but some apps might not need all dependencies - using shared-git as a safe base
      ignoreDifferences:
        - group: argoproj.io
          kind: ApplicationSet
          jsonPointers:
            - /status
