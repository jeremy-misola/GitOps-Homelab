apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: adguard-home
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://k8s-at-home.com/charts/
    chart: adguard-home
    targetRevision: 5.5.2
    helm:
      values: |
        service:
          dns-tcp:
            type: LoadBalancer
            annotations:
              tailscale.com/expose: "true"
          dns-udp:
            type: LoadBalancer
            annotations:
              tailscale.com/expose: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: adguard-home
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
