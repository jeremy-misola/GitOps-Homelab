
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-package
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  project: default
  source:
    path: apps/templates/istio
    repoURL: https://github.com/jeremy-misola/homelabv2.git
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      allowEmpty: true
      selfHeal: true

