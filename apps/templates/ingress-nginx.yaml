apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-ingress
  namespace: ingress-nginx
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.13.3
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
