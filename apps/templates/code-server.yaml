apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: code-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://nicholaswilde.github.io/helm-charts/
    chart: code-server
    helm:
      values: |
        persistence:
          config:
            enabled: true
            emptyDir: true
            mountPath: /config
    targetRevision: 1.1.1
  destination:
    server: https://kubernetes.default.svc
    namespace: code-server
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true