apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-cd
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  project: default
  source:
    path: charts/argo-cd
    repoURL: https://github.com/jeremy-misola/homelabv2.git
    targetRevision: HEAD
  helm:
    parameters:
    - name: "server.insecure"
      value: "true"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true



