global:
  fullnameOverride: slskd

# local-path volumes are node-local: navidrome-music and lidarr-config live on
# prod-worker-1, and lidarr also mounts slskd-downloads, so slskd-downloads has
# to be provisioned on that same node or lidarr becomes unschedulable.
defaultPodOptions:
  nodeSelector:
    kubernetes.io/hostname: prod-worker-1
  # lidarr's image runs as a fixed uid/gid 568 with no PUID/PGID override --
  # files slskd downloads have to be owned by that same uid or lidarr can't
  # move them into /music (UnauthorizedAccessException on import).
  securityContext:
    runAsUser: 568
    runAsGroup: 568
    fsGroup: 568

controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/slskd/slskd
          tag: 0.26.0
        env:
          TZ: America/Toronto
          # slskd's own web UI login -- Authentik OIDC was tried here but the
          # frontend's background /api/v0/session polling races the OIDC
          # redirect flow (every poll re-triggers a fresh Authentik login
          # attempt), which corrupts the flow you're actively logging into
          # ("No identification provided"). Native auth doesn't redirect, so
          # it doesn't have that problem.
          SLSKD_USERNAME:
            valueFrom:
              secretKeyRef:
                name: slskd-webui-credentials
                key: username
          SLSKD_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: slskd-webui-credentials
                key: password
          # Enabling native auth above locked down slskd's REST API too, not
          # just the web UI -- soularr needs a real key to call it now.
          SLSKD_API_KEY:
            valueFrom:
              secretKeyRef:
                name: slskd-webui-credentials
                key: apiKey
          SLSKD_DOWNLOADS_DIR: /downloads
          SLSKD_INCOMPLETE_DIR: /incomplete
          SLSKD_SLSK_USERNAME:
            valueFrom:
              secretKeyRef:
                name: slskd-soulseek-credentials
                key: username
          SLSKD_SLSK_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: slskd-soulseek-credentials
                key: password

service:
  main:
    controller: main
    ports:
      http:
        port: 5030

persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    storageClass: local-path
    size: 1Gi
    globalMounts:
      - path: /app
  # Shared with lidarr and soularr (existingClaim: slskd-downloads) as the
  # staging area slskd downloads into and lidarr imports from.
  downloads:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    storageClass: local-path
    size: 20Gi
    globalMounts:
      - path: /downloads
  # In-progress transfers only -- doesn't need to survive a pod restart, and
  # doesn't need to exist as a subdirectory of /downloads for other pods to see.
  incomplete:
    type: emptyDir
    globalMounts:
      - path: /incomplete

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi
