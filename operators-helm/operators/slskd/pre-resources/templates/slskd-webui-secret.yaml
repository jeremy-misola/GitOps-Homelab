apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: slskd-webui-credentials
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: slskd-webui-credentials
    creationPolicy: Owner
  data:
  - secretKey: username
    remoteRef:
      key: SLSKD_WEBUI_USERNAME
  - secretKey: password
    remoteRef:
      key: SLSKD_WEBUI_PASSWORD
  # Used as slskd's REST API key -- soularr authenticates to slskd's API with
  # this (separate from the web UI login above). Any random string works;
  # nothing reads it as a password meant for a human.
  - secretKey: apiKey
    remoteRef:
      key: SLSKD_API_KEY
