controllers:
  main:
    containers:
      main:
        image:
          tag: v2.6.3
        env:
          IMMICH_HOST: "0.0.0.0"
          REDIS_HOSTNAME: '{{ printf "%s-valkey" .Release.Name }}'
          IMMICH_MACHINE_LEARNING_URL: '{{ printf "http://%s-machine-learning:3003" .Release.Name }}'
          DB_HOSTNAME:
            valueFrom:
              secretKeyRef:
                name: immich-db-credentials
                key: host
          DB_DATABASE_NAME:
            value: immich
          DB_USERNAME:
            valueFrom:
              secretKeyRef:
                name: immich-db-credentials
                key: username
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-db-credentials
                key: password
          DB_VECTOR_EXTENSION:
            value: pgvector
          IMMICH_S3_ENDPOINT:
            valueFrom:
              secretKeyRef:
                name: immich-s3-credentials
                key: host
          IMMICH_S3_BUCKET:
            valueFrom:
              secretKeyRef:
                name: immich-s3-credentials
                key: bucket
          IMMICH_S3_ACCESS_KEY:
            valueFrom:
              secretKeyRef:
                name: immich-s3-credentials
                key: accessKey
          IMMICH_S3_SECRET_KEY:
            valueFrom:
              secretKeyRef:
                name: immich-s3-credentials
                key: secretKey
          IMMICH_S3_REGION:
            value: garage
          IMMICH_S3_ADDRESSING_STYLE:
            value: path
          # OIDC (Authentik) - handled at Envoy gateway level via SecurityPolicy
          IMMICH_OAUTH_ENABLED:
            value: "true"
          IMMICH_OAUTH_CLIENT_ID:
            valueFrom:
              secretKeyRef:
                name: immich-client-secret
                key: client-id
          IMMICH_OAUTH_CLIENT_SECRET:
            valueFrom:
              secretKeyRef:
                name: immich-client-secret
                key: client-secret
          IMMICH_OAUTH_ISSUER_URL:
            value: "https://auth-dev.jeremymr.dev/application/o/immich/"
          IMMICH_OAUTH_REDIRECT_URI:
            value: "https://photos-dev.jeremymr.dev/oauth2/callback"
          IMMICH_OAUTH_AUTO_REGISTRATION:
            value: "true"
          IMMICH_OAUTH_BUTTON_TEXT:
            value: "Sign in with Authentik"

immich:
  metrics:
    enabled: false
  persistence:
    library:
      existingClaim: immich-library
  configuration:
    trash:
      enabled: false
      days: 30
    storageTemplate:
      enabled: true
      template: "{{y}}/{{y}}-{{MM}}-{{dd}}/{{filename}}"
  configurationKind: ConfigMap

valkey:
  enabled: true
  controllers:
    main:
      containers:
        main:
          image:
            repository: docker.io/valkey/valkey
            tag: 9.1-alpine@sha256:34f4f659e02a67cfdf3995d11ae432219c936005055b2cd39a042e86280e053e
            pullPolicy: IfNotPresent
  persistence:
    data:
      enabled: true
      size: 1Gi
      type: emptyDir
      accessMode: ReadWriteOnce

server:
  enabled: true
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-server
            pullPolicy: IfNotPresent
  ingress:
    main:
      enabled: false

machine-learning:
  enabled: true
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-machine-learning
            pullPolicy: IfNotPresent
          env:
            TRANSFORMERS_CACHE: /cache
            HF_XET_CACHE: /cache/huggingface-xet
            MPLCONFIGDIR: /cache/matplotlib-config
  persistence:
    cache:
      enabled: true
      size: 10Gi
      type: emptyDir
      accessMode: ReadWriteMany

microservices:
  enabled: true