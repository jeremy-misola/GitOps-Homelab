apiVersion: v1
kind: Secret
metadata:
  name: immich-db-credentials
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
type: Opaque
stringData:
  host: immich-rw
  port: "5432"
  database: immich
  username: immich
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-db-credentials-password
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: immich-db-credentials
    creationPolicy: Merge
  data:
  - secretKey: password
    remoteRef:
      key: IMMICH_DB_PASSWORD