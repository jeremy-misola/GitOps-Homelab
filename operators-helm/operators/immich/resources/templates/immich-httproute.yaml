apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich-route
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
  - name: {{ .Values.gatewayName }}
    namespace: envoy-gateway-system
  hostnames:
    - photos{{ .Values.envSuffix }}.jeremymr.dev
  rules:
  - backendRefs:
    - name: immich-server
      port: 3001