apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backstage-route
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
  - name: {{ .Values.gatewayName }}
    namespace: envoy-gateway-system
  hostnames:
    - devdocs{{ .Values.envSuffix }}.jeremymr.dev
  rules:
  - backendRefs:
    - name: backstage
      port: 7007