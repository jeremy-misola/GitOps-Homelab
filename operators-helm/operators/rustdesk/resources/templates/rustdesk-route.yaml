apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustdesk-route
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
  - name: {{ .Values.gatewayName }}
    namespace: envoy-gateway-system
  hostnames:
    - rustdesk{{ .Values.envSuffix }}.jeremymr.dev
  rules:
  - backendRefs:
    - name: rustdesk
      port: 21118
