image:
  repository: "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s"
mode: daemonset
service:
  enabled: true
  type: ClusterIP

# 1. Provide permissions to read logs and talk to K8s API
presets:
  logsCollection:
    enabled: true
  kubernetesAttributes:
    enabled: true

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    # filelog is automatically configured by the logsCollection preset above,
    # but you can override it here if needed.
    filelog:
      include: [ /var/log/pods/*/*/*.log ]
      # Exclude the collector's own logs to avoid loops
      exclude: [ /var/log/pods/opentelemetry-collector_*/*/*.log ]
      operators:
        - type: container

  processors:
    # Adds pod_name, namespace, etc. to the logs
    k8sattributes:
      extract:
        metadata:
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.deployment.name
          - k8s.namespace.name
          - k8s.node.name
          - k8s.container.name
      pod_association:
        - sources:
            - from: resource_attribute
              name: k8s.pod.name
        - sources:
            - from: resource_attribute
              name: k8s.pod.ip

    batch:
      send_batch_size: 1000
      timeout: 10s

  extensions:
    health_check: {}

  exporters:
    # Self-hosted Loki
    otlphttp/loki:
      endpoint: http://loki-helm-stack-gateway.loki.svc.cluster.local:80/otlp
      headers:
        X-Scope-OrgID: "1"
    # Self-hosted Tempo
    otlp/tempo:
      endpoint: tempo-helm.tempo.svc.cluster.local:4317
      tls:
        insecure: true
    # Self-hosted Mimir — same push endpoint + tenant as the Prometheus
    # remote-write path, so OTLP metrics land in the "prod" tenant and are
    # queryable via the existing Grafana "Mimir" datasource.
    prometheusremotewrite/mimir:
      endpoint: http://mimir-helm-nginx.mimir.svc.cluster.local/api/v1/push
      headers:
        X-Scope-OrgID: prod
      # Match Prometheus' externalLabels for a unified prod view.
      external_labels:
        cluster: prod
      # Promote k8s.* resource attributes (from the k8sattributes processor)
      # to series labels: namespace, pod, node, etc.
      resource_to_telemetry_conversion:
        enabled: true

  service:
    extensions: [health_check]
    pipelines:
      logs:
        receivers: [otlp, filelog]
        processors: [k8sattributes, batch]
        exporters: [otlphttp/loki]
      traces:
        receivers: [otlp]
        processors: [k8sattributes, batch]
        exporters: [otlp/tempo]
      # Only the exporters list is overridden here; the chart's default metrics
      # receivers ([otlp, prometheus]) and processors ([k8sattributes,
      # memory_limiter, batch]) are preserved via deep-merge. "debug" is kept so
      # it remains a referenced component (the collector errors on any defined
      # but unused component).
      metrics:
        exporters: [debug, prometheusremotewrite/mimir]
