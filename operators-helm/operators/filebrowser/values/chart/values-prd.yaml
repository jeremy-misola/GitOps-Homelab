fullnameOverride: filebrowser

# Follows navidrome-music's PV, which is moving to prod-worker-1.
nodeSelector:
  kubernetes.io/hostname: prod-worker-1

env:
  TZ: America/Toronto

config: |
  {
    "port": 80,
    "baseURL": "",
    "address": "",
    "log": "stdout",
    "database": "/config/database.db",
    "root": "/music",
    "noauth": true
  }

persistence:
  config:
    enabled: true
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 512Mi
  data:
    enabled: true
    existingClaim: navidrome-music
    mountPath: /music

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
