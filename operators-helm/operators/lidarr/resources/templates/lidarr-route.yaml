apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lidarr-route
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
  - name: {{ .Values.gatewayName }}
    namespace: envoy-gateway-system
  hostnames:
    - lidarr{{ .Values.envSuffix }}.jeremymr.dev
  rules:
  - backendRefs:
    - name: lidarr
      port: 8686
