fullnameOverride: lidarr

# Follows navidrome-music's and slskd-downloads' PVs, both moving to prod-worker-1.
nodeSelector:
  kubernetes.io/hostname: prod-worker-1

env:
  TZ: America/Toronto

persistence:
  config:
    enabled: true
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 1Gi
  media:
    enabled: true
    existingClaim: navidrome-music
    mountPath: /music
  downloads:
    enabled: true
    existingClaim: slskd-downloads
    mountPath: /downloads

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi
