apiVersion: v1
kind: ConfigMap
metadata:
  name: lidarr-discovery-script
  namespace: {{ .Release.Namespace }}
data:
  discover.py: |
    #!/usr/bin/env python3
    """Feeds Lidarr with artist candidates from two discovery sources: Last.fm
    similar-artists (seeded from your own top scrobbles) and ListenBrainz's
    auto-generated recommendation playlists (Weekly Jams / Weekly Exploration).
    
    New artists are added unmonitored and tagged "auto-discovery". A separate
    sweep then picks each auto-discovery artist's single most-played album (via
    Last.fm) and monitors + searches just that one -- no browsing 29 artists and
    hand-picking albums. Once an artist has been swept it's tagged "auto-picked"
    so we never touch it again, which also means: untag/re-tag or just unmonitor
    the album yourself and it stays that way.
    
    Artists NOT tagged "auto-discovery" (anything you added yourself, or that
    predates this tagging) are never touched by the sweep -- full manual control
    stays the default for anything outside this pipeline.
    """
    import json
    import logging
    import os
    import re
    import sys
    import time
    import urllib.error
    import urllib.parse
    import urllib.request
    
    logging.basicConfig(
        level=os.environ.get("LOG_LEVEL", "INFO"),
        format="[%(asctime)s] %(levelname)s: %(message)s",
        datefmt="%Y-%m-%dT%H:%M:%S%z",
    )
    log = logging.getLogger("discover")
    
    LIDARR_URL = os.environ.get("LIDARR_URL", "http://lidarr:8686").rstrip("/")
    LIDARR_API_KEY = os.environ["LIDARR_API_KEY"]
    LASTFM_API_KEY = os.environ["LASTFM_API_KEY"]
    LASTFM_USERNAME = os.environ["LASTFM_USERNAME"]
    LISTENBRAINZ_USERNAME = os.environ.get("LISTENBRAINZ_USERNAME", "")
    LISTENBRAINZ_TOKEN = os.environ.get("LISTENBRAINZ_TOKEN", "")
    ROOT_FOLDER_PATH = os.environ.get("ROOT_FOLDER_PATH", "/music/")
    QUALITY_PROFILE_ID = int(os.environ.get("QUALITY_PROFILE_ID", "1"))
    METADATA_PROFILE_ID = int(os.environ.get("METADATA_PROFILE_ID", "1"))
    RUN_INTERVAL_SECONDS = int(os.environ.get("RUN_INTERVAL_SECONDS", "86400"))
    SIMILAR_ARTIST_SEED_COUNT = int(os.environ.get("SIMILAR_ARTIST_SEED_COUNT", "10"))
    SIMILAR_ARTIST_PER_SEED = int(os.environ.get("SIMILAR_ARTIST_PER_SEED", "5"))
    MIN_MATCH_SCORE = float(os.environ.get("MIN_MATCH_SCORE", "0.3"))
    
    AUTO_DISCOVERY_TAG = "auto-discovery"
    AUTO_PICKED_TAG = "auto-picked"
    
    
    def http_json(url, headers=None, method="GET", body=None):
        data = json.dumps(body).encode() if body is not None else None
        req = urllib.request.Request(url, data=data, method=method, headers=headers or {})
        if data is not None:
            req.add_header("Content-Type", "application/json")
        with urllib.request.urlopen(req, timeout=30) as resp:
            raw = resp.read()
            return json.loads(raw) if raw else None
    
    
    def lidarr_get(path, params=None):
        qs = f"?{urllib.parse.urlencode(params)}" if params else ""
        url = f"{LIDARR_URL}/api/v1/{path}{qs}"
        return http_json(url, headers={"X-Api-Key": LIDARR_API_KEY})
    
    
    def lidarr_post(path, body):
        url = f"{LIDARR_URL}/api/v1/{path}"
        return http_json(url, headers={"X-Api-Key": LIDARR_API_KEY}, method="POST", body=body)
    
    
    def lidarr_put(path, body):
        url = f"{LIDARR_URL}/api/v1/{path}"
        return http_json(url, headers={"X-Api-Key": LIDARR_API_KEY}, method="PUT", body=body)
    
    
    def lastfm_get(method, **params):
        params.update({"method": method, "api_key": LASTFM_API_KEY, "format": "json"})
        url = f"https://ws.audioscrobbler.com/2.0/?{urllib.parse.urlencode(params)}"
        return http_json(url)
    
    
    def listenbrainz_get(path):
        url = f"https://api.listenbrainz.org/1/{path}"
        headers = {"Authorization": f"Token {LISTENBRAINZ_TOKEN}"} if LISTENBRAINZ_TOKEN else {}
        return http_json(url, headers=headers)
    
    
    def get_or_create_tag(label):
        tags = lidarr_get("tag") or []
        for t in tags:
            if t["label"] == label:
                return t["id"]
        created = lidarr_post("tag", {"label": label})
        return created["id"]
    
    
    def get_existing_artists():
        """Returns {foreignArtistId: artistName} for everything already in Lidarr."""
        artists = lidarr_get("artist") or []
        return {a["foreignArtistId"]: a["artistName"] for a in artists if a.get("foreignArtistId")}
    
    
    def discover_lastfm_similar():
        """Seed from your top scrobbled artists, expand via Last.fm's similar-artist graph."""
        candidates = {}  # name -> mbid (may be "")
        top = lastfm_get("user.gettopartists", user=LASTFM_USERNAME, period="3month",
                          limit=SIMILAR_ARTIST_SEED_COUNT)
        seeds = [a["name"] for a in (top or {}).get("topartists", {}).get("artist", [])]
        log.info("Last.fm seed artists (your top %d, 3mo): %s", len(seeds), ", ".join(seeds))
    
        for seed in seeds:
            try:
                resp = lastfm_get("artist.getsimilar", artist=seed, limit=SIMILAR_ARTIST_PER_SEED)
                similar = (resp or {}).get("similarartists", {}).get("artist", [])
            except urllib.error.HTTPError as e:
                log.warning("Last.fm getsimilar failed for %r: %s", seed, e)
                continue
            for a in similar:
                try:
                    score = float(a.get("match", 0))
                except (TypeError, ValueError):
                    score = 0.0
                if score < MIN_MATCH_SCORE:
                    continue
                candidates[a["name"]] = a.get("mbid", "")
        log.info("Last.fm similar-artist candidates above threshold: %d", len(candidates))
        return candidates
    
    
    def discover_listenbrainz_recommendations():
        """Pull artists out of ListenBrainz's auto-generated weekly playlists, if any exist yet."""
        candidates = {}
        if not (LISTENBRAINZ_USERNAME and LISTENBRAINZ_TOKEN):
            log.info("ListenBrainz not configured, skipping")
            return candidates
    
        try:
            resp = listenbrainz_get(f"user/{LISTENBRAINZ_USERNAME}/playlists/createdfor")
        except urllib.error.HTTPError as e:
            log.warning("ListenBrainz playlists/createdfor failed: %s", e)
            return candidates
    
        playlists = (resp or {}).get("playlists", [])
        targets = [p for p in playlists
                   if any(k in p.get("playlist", {}).get("title", "").lower()
                          for k in ("weekly jams", "weekly exploration", "daily jams"))]
        if not targets:
            log.info("No ListenBrainz recommendation playlists yet -- needs more listening "
                      "history before it generates any (usually a couple of weeks).")
            return candidates
    
        for p in targets:
            mbid = p["playlist"]["identifier"].rsplit("/", 1)[-1]
            title = p["playlist"]["title"]
            try:
                detail = listenbrainz_get(f"playlist/{mbid}")
            except urllib.error.HTTPError as e:
                log.warning("Failed to fetch playlist %r (%s): %s", title, mbid, e)
                continue
            tracks = detail.get("playlist", {}).get("track", [])
            log.info("ListenBrainz playlist %r: %d tracks", title, len(tracks))
            for t in tracks:
                name = t.get("creator")
                if not name:
                    continue
                artist_mbid = ""
                ext = t.get("extension", {}).get(
                    "https://musicbrainz.org/doc/jspf#track", {})
                ids = ext.get("artist_identifiers") or []
                if ids:
                    artist_mbid = ids[0].rsplit("/", 1)[-1]
                candidates[name] = artist_mbid
        log.info("ListenBrainz recommendation candidates: %d", len(candidates))
        return candidates
    
    
    def add_to_lidarr(name, mbid, existing, auto_discovery_tag_id):
        if mbid and mbid in existing:
            return  # already have this artist
        term = f"lidarr:{mbid}" if mbid else name
        try:
            results = lidarr_get("artist/lookup", params={"term": term})
        except urllib.error.HTTPError as e:
            log.warning("Lookup failed for %r: %s", name, e)
            return
        if not results:
            log.info("No Lidarr metadata match for %r, skipping", name)
            return
        match = results[0]
        fid = match["foreignArtistId"]
        if fid in existing:
            return  # resolved to an artist we already have
        body = {
            "artistName": match["artistName"],
            "foreignArtistId": fid,
            "qualityProfileId": QUALITY_PROFILE_ID,
            "metadataProfileId": METADATA_PROFILE_ID,
            "rootFolderPath": ROOT_FOLDER_PATH,
            "monitored": False,
            "tags": [auto_discovery_tag_id],
            "addOptions": {"monitor": "none", "searchForMissingAlbums": False},
        }
        try:
            lidarr_post("artist", body)
            log.info("Added candidate artist: %s", match["artistName"])
            existing[fid] = match["artistName"]
        except urllib.error.HTTPError as e:
            if e.code == 400:
                log.debug("Artist %r already exists or invalid: %s", name, e)
            else:
                log.warning("Failed to add %r: %s", name, e)
    
    
    def _normalize(title):
        return re.sub(r"[^a-z0-9]", "", title.lower())
    
    
    def pick_best_album(artist_name, lidarr_albums):
        """Match Last.fm's most-played albums against what Lidarr actually has,
        preferring a real studio album over singles/EPs/compilations."""
        try:
            resp = lastfm_get("artist.gettopalbums", artist=artist_name, limit=10)
            top = (resp or {}).get("topalbums", {}).get("album", [])
        except urllib.error.HTTPError as e:
            log.warning("Last.fm gettopalbums failed for %r: %s", artist_name, e)
            top = []
    
        by_norm = {_normalize(a["title"]): a for a in lidarr_albums}
        for entry in top:
            norm = _normalize(entry["name"])
            if norm in by_norm:
                return by_norm[norm]
            for n, album in by_norm.items():
                if norm and (norm in n or n in norm):
                    return album
    
        # No Last.fm match -- fall back to the studio album with the most tracks.
        studio = [a for a in lidarr_albums if a.get("albumType") == "Album"]
        pool = studio or lidarr_albums
        if not pool:
            return None
        return max(pool, key=lambda a: a.get("statistics", {}).get("trackCount", 0))
    
    
    def auto_pick_albums(auto_discovery_tag_id, auto_picked_tag_id):
        """For every auto-discovery artist we haven't processed yet, once Lidarr
        has pulled its album metadata, monitor + search just its top album."""
        artists = lidarr_get("artist") or []
        pending = [
            a for a in artists
            if auto_discovery_tag_id in a.get("tags", [])
            and auto_picked_tag_id not in a.get("tags", [])
        ]
        if not pending:
            return
        log.info("%d auto-discovery artist(s) awaiting an album pick", len(pending))
    
        for artist in pending:
            if not artist.get("statistics", {}).get("albumCount"):
                log.debug("%s: Lidarr metadata not loaded yet, will retry next run",
                          artist["artistName"])
                continue
    
            albums = lidarr_get("album", params={"artistId": artist["id"]}) or []
            if any(a["monitored"] for a in albums):
                # Already has something monitored (e.g. you did it yourself) --
                # just mark it processed so we leave it alone going forward.
                pass
            else:
                best = pick_best_album(artist["artistName"], albums)
                if best is None:
                    log.info("%s: no albums found at all, will retry next run",
                              artist["artistName"])
                    continue
                try:
                    lidarr_put("album/monitor", {"albumIds": [best["id"]], "monitored": True})
                    lidarr_post("command", {"name": "AlbumSearch", "albumIds": [best["id"]]})
                    log.info("Auto-picked album for %s: %s", artist["artistName"], best["title"])
                except urllib.error.HTTPError as e:
                    log.warning("Failed to monitor/search album for %s: %s",
                                artist["artistName"], e)
                    continue
    
            new_tags = list(set(artist.get("tags", []) + [auto_picked_tag_id]))
            artist["tags"] = new_tags
            try:
                lidarr_put(f"artist/{artist['id']}", artist)
            except urllib.error.HTTPError as e:
                log.warning("Failed to tag %s as auto-picked: %s", artist["artistName"], e)
    
    
    def run_once():
        auto_discovery_tag_id = get_or_create_tag(AUTO_DISCOVERY_TAG)
        auto_picked_tag_id = get_or_create_tag(AUTO_PICKED_TAG)
    
        existing = get_existing_artists()
        log.info("Lidarr currently has %d artists", len(existing))
    
        candidates = {}
        candidates.update(discover_lastfm_similar())
        candidates.update(discover_listenbrainz_recommendations())
    
        log.info("Total unique discovery candidates this run: %d", len(candidates))
        for name, mbid in candidates.items():
            add_to_lidarr(name, mbid, existing, auto_discovery_tag_id)
    
        auto_pick_albums(auto_discovery_tag_id, auto_picked_tag_id)
    
    
    def main():
        while True:
            try:
                run_once()
            except Exception:
                log.exception("Discovery run failed")
            log.info("Sleeping %ds until next run", RUN_INTERVAL_SECONDS)
            time.sleep(RUN_INTERVAL_SECONDS)
    
    
    if __name__ == "__main__":
        sys.exit(main())
