apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lidarr-discovery-credentials
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: lidarr-discovery-credentials
    creationPolicy: Owner
  data:
  - secretKey: lidarrApiKey
    remoteRef:
      key: LIDARR_API_KEY
  # Reuses the same Last.fm developer app key Navidrome scrobbles with --
  # it's just an API key, not a per-user credential.
  - secretKey: lastfmApiKey
    remoteRef:
      key: NAVIDROME_LASTFM_API_KEY
  # Personal ListenBrainz user token, from https://listenbrainz.org/settings/
  # -- the same token you enter into Navidrome's UI for ListenBrainz
  # scrobbling. Needs to be added to Doppler before this ExternalSecret syncs.
  - secretKey: listenbrainzToken
    remoteRef:
      key: LISTENBRAINZ_USER_TOKEN
  - secretKey: listenbrainzUsername
    remoteRef:
      key: LISTENBRAINZ_USERNAME
