# Vaultwarden Helm chart values for dev environment
# Chart: vaultwarden v0.39.0

image:
  tag: "1.36.0-alpine"

# Domain where the application is accessed
domain: "https://vaultwarden-dev.jeremymr.dev"

# Enable signups for SSO auto-provisioning (restricted to domain via signupsDomains if needed)
signupsAllowed: true

# SSO OpenID Connect Configuration (Authentik)
sso:
  enabled: true
  # Pull client ID and secret from the Crossplane-generated secret
  existingSecret: "vaultwarden-oidc-credentials"
  clientId:
    existingSecretKey: "client_id"
  clientSecret:
    existingSecretKey: "client_secret"
  # Authority URL must be the provider base URL without trailing slash
  authority: "https://auth-dev.jeremymr.dev/application/o/vaultwarden"
  scopes: "openid email profile offline_access"
  onlySSO: false
  signupsMatchEmail: true
  ignoreEmailVerification: false
  cacheExpiration: 0