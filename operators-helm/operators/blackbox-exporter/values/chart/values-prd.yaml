releaseLabel: true
serviceMonitor:
  enabled: true
  defaults:
    labels:
      release: kube-prometheus
  targets:
  - name: argocd
    url: http://argocd.jeremymr.dev/healthz
    interval: 60s
    scrapeTimeout: 60s
    module: http_2xx
  - name: kleff
    url: https://kleff.io
    interval: 60s
    scrapeTimeout: 60s
    module: http_2xx
