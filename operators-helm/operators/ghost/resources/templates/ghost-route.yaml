apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ghost-route
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
  - name: {{ .Values.gatewayName }}
    namespace: envoy-gateway-system
  hostnames:
    - blog{{ .Values.envSuffix }}.jeremymr.dev
  rules:
  - backendRefs:
    - name: ghost
      port: 2368
