apiVersion: batch/v1
kind: Job
metadata:
  name: mimir-alertmanager-config-upload
  namespace: mimir
  annotations:
    # Run after all resources in this Application are synced, re-creates on each sync
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: render-config
          image: alpine:3.24
          command:
            - sh
            - -c
            - |
              apk add --no-cache gettext > /dev/null 2>&1
              envsubst < /config-template/alertmanager.yaml > /rendered/alertmanager.yaml
              echo "Rendered alertmanager config:"
              cat /rendered/alertmanager.yaml
          env:
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: alertmanager-discord-webhook
                  key: discord-webhook-url
          volumeMounts:
            - name: config-template
              mountPath: /config-template
            - name: rendered-config
              mountPath: /rendered
      containers:
        - name: upload
          # mimirtool version matches mimir-distributed chart 5.6.0 = mimir 2.16.0
          image: grafana/mimirtool:2.17.11
          command:
            - mimirtool
            - alertmanager
            - load
            - /rendered/alertmanager.yaml
            - --address=http://mimir-helm-nginx.mimir.svc.cluster.local
            - --id=prod
          volumeMounts:
            - name: rendered-config
              mountPath: /rendered
      volumes:
        - name: config-template
          configMap:
            name: mimir-alertmanager-config-template
        - name: rendered-config
          emptyDir: {}
