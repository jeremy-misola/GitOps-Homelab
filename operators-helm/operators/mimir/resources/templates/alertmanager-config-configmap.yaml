apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-alertmanager-config-template
  namespace: mimir
data:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: discord
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"

    receivers:
      - name: "null"
      - name: discord
        discord_configs:
          - webhook_url: '$DISCORD_WEBHOOK_URL'
            send_resolved: true
            title: |-
              [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
            message: |-
              {{ range .Alerts }}
              **Alert:** {{ .Annotations.summary }}{{ if .Annotations.description }}
              **Description:** {{ .Annotations.description }}{{ end }}
              **Severity:** {{ .Labels.severity }}
              **Namespace:** {{ .Labels.namespace }}
              {{ end }}

    inhibit_rules:
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity =~ "warning|info"
        equal: [namespace, alertname]
      - source_matchers:
          - severity = "warning"
        target_matchers:
          - severity = "info"
        equal: [namespace, alertname]
      - source_matchers:
          - alertname = "InfoInhibitor"
        target_matchers:
          - severity = "info"
        equal: [namespace]
