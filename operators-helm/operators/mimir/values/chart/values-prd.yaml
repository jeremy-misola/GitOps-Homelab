mimir:
  structuredConfig:
    multitenancy_enabled: true

    common:
      storage:
        backend: s3
        s3:
          endpoint: garage.garage.svc.cluster.local:3900
          region: garage
          access_key_id: ${S3_ACCESS_KEY}
          secret_access_key: ${S3_SECRET_KEY}
          insecure: true
          path_style_force_enabled: true

    blocks_storage:
      s3:
        bucket_name: mimir-blocks

    alertmanager_storage:
      s3:
        bucket_name: mimir-alertmanager

    ruler_storage:
      s3:
        bucket_name: mimir-ruler

    limits:
      ingestion_rate: 100000
      max_global_series_per_user: 1000000
      compactor_blocks_retention_period: 90d

# Homelab sizing: single replica per component, no zone-aware replication
ingester:
  replicas: 1
  zoneAwareReplication:
    enabled: false

distributor:
  replicas: 1

querier:
  replicas: 1

query_frontend:
  replicas: 1

ruler:
  replicas: 1

compactor:
  replicas: 1

store_gateway:
  replicas: 1
  zoneAwareReplication:
    enabled: false

alertmanager:
  enabled: true
  replicas: 1
  zoneAwareReplication:
    enabled: false

minio:
  enabled: false

# Nginx gateway — unified ingress point for remoteWrite and queries.
# Given a dedicated MetalLB IP so the dev cluster can push cross-cluster
# without DNS rewrites (192.168.0.241 is next after the Envoy Gateway at .240).
nginx:
  enabled: true
  service:
    type: LoadBalancer
    annotations:
      metallb.universe.tf/loadBalancerIPs: "192.168.0.241"

# Pass S3 credentials to all components via global extraEnv
global:
  extraEnv:
    - name: S3_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: mimir-s3-credentials
          key: access-key-id
    - name: S3_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: mimir-s3-credentials
          key: secret-access-key
