apiVersion: v1
kind: ConfigMap
metadata:
  name: quickplay-script
  namespace: {{ .Release.Namespace }}
data:
  quickplay.py: |
    #!/usr/bin/env python3
    """Search-and-grab a single song: type an artist + song title, this finds the
    matching release in Lidarr's metadata (preferring an actual Single over a
    full album), monitors just that one, and lets the existing soularr/slskd
    pipeline pull it in -- same reliability as everything else, just triggered
    per-song instead of per-album.
    
    Auth is handled entirely at the gateway (Envoy SecurityPolicy + Authentik
    OIDC) -- this app has no login code and trusts anything that reaches it.
    """
    import json
    import os
    import re
    import urllib.error
    import urllib.parse
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    
    LIDARR_URL = os.environ.get("LIDARR_URL", "http://lidarr:8686").rstrip("/")
    LIDARR_API_KEY = os.environ["LIDARR_API_KEY"]
    ROOT_FOLDER_PATH = os.environ.get("ROOT_FOLDER_PATH", "/music/")
    QUALITY_PROFILE_ID = int(os.environ.get("QUALITY_PROFILE_ID", "1"))
    METADATA_PROFILE_ID = int(os.environ.get("METADATA_PROFILE_ID", "1"))
    PORT = int(os.environ.get("PORT", "8080"))
    QUICK_GRAB_TAG = "quick-grab"
    MAX_ALBUMS_TO_SCAN = 40
    
    
    def lidarr_get(path, params=None):
        qs = f"?{urllib.parse.urlencode(params)}" if params else ""
        req = urllib.request.Request(f"{LIDARR_URL}/api/v1/{path}{qs}",
                                      headers={"X-Api-Key": LIDARR_API_KEY})
        with urllib.request.urlopen(req, timeout=30) as r:
            raw = r.read()
            return json.loads(raw) if raw else None
    
    
    def lidarr_post(path, body):
        data = json.dumps(body).encode()
        req = urllib.request.Request(f"{LIDARR_URL}/api/v1/{path}", data=data, method="POST",
                                      headers={"X-Api-Key": LIDARR_API_KEY, "Content-Type": "application/json"})
        with urllib.request.urlopen(req, timeout=30) as r:
            raw = r.read()
            return json.loads(raw) if raw else None
    
    
    def lidarr_put(path, body):
        data = json.dumps(body).encode()
        req = urllib.request.Request(f"{LIDARR_URL}/api/v1/{path}", data=data, method="PUT",
                                      headers={"X-Api-Key": LIDARR_API_KEY, "Content-Type": "application/json"})
        with urllib.request.urlopen(req, timeout=30) as r:
            raw = r.read()
            return json.loads(raw) if raw else None
    
    
    def get_or_create_tag(label):
        for t in lidarr_get("tag") or []:
            if t["label"] == label:
                return t["id"]
        return lidarr_post("tag", {"label": label})["id"]
    
    
    def normalize(title):
        return re.sub(r"[^a-z0-9]", "", title.lower())
    
    
    def find_existing_artist(name):
        norm = normalize(name)
        for a in lidarr_get("artist") or []:
            if normalize(a["artistName"]) == norm:
                return a
        return None
    
    
    def add_artist(name, tag_id):
        results = lidarr_get("artist/lookup", params={"term": name})
        if not results:
            return None, f"No Lidarr metadata match for artist {name!r}"
        match = results[0]
        body = {
            "artistName": match["artistName"],
            "foreignArtistId": match["foreignArtistId"],
            "qualityProfileId": QUALITY_PROFILE_ID,
            "metadataProfileId": METADATA_PROFILE_ID,
            "rootFolderPath": ROOT_FOLDER_PATH,
            "monitored": False,
            "tags": [tag_id],
            "addOptions": {"monitor": "none", "searchForMissingAlbums": False},
        }
        created = lidarr_post("artist", body)
        return created, None
    
    
    def find_matching_release(artist_id, song_title):
        """Prefer a Single whose title matches; otherwise scan album tracklists
        for a matching track and grab whichever (smallest/Single-first) album
        contains it."""
        albums = lidarr_get("album", params={"artistId": artist_id}) or []
        norm_song = normalize(song_title)
    
        def title_matches(t):
            n = normalize(t)
            return norm_song == n or norm_song in n or n in norm_song
    
        singles = [a for a in albums if a.get("albumType") == "Single"]
        for a in singles:
            if title_matches(a["title"]):
                return a
    
        for a in albums:
            if title_matches(a["title"]):
                return a
    
        albums_by_recency = sorted(albums, key=lambda a: a.get("releaseDate") or "", reverse=True)
        for a in albums_by_recency[:MAX_ALBUMS_TO_SCAN]:
            tracks = lidarr_get("track", params={"albumId": a["id"]}) or []
            if any(title_matches(t["title"]) for t in tracks):
                return a
        return None
    
    
    def grab(artist_name, song_title):
        tag_id = get_or_create_tag(QUICK_GRAB_TAG)
    
        artist = find_existing_artist(artist_name)
        just_added = False
        if artist is None:
            artist, err = add_artist(artist_name, tag_id)
            if err:
                return {"status": "not_found", "message": err}
            just_added = True
    
        if not artist.get("statistics", {}).get("albumCount"):
            if just_added:
                return {"status": "pending",
                        "message": f"Added {artist['artistName']} -- Lidarr is still fetching their "
                                    "catalog metadata, try again in ~30s"}
            return {"status": "pending",
                    "message": f"{artist['artistName']}'s catalog isn't loaded yet, try again shortly"}
    
        album = find_matching_release(artist["id"], song_title)
        if album is None:
            return {"status": "not_found",
                    "message": f"Couldn't find a release matching {song_title!r} by {artist['artistName']}"}
    
        if not album["monitored"]:
            lidarr_put("album/monitor", {"albumIds": [album["id"]], "monitored": True})
        if not artist["monitored"]:
            artist["monitored"] = True
            artist["tags"] = list(set(artist.get("tags", []) + [tag_id]))
            lidarr_put(f"artist/{artist['id']}", artist)
    
        return {"status": "queued", "artist": artist["artistName"], "album": album["title"]}
    
    
    PAGE = """<!doctype html>
    <html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>quickplay</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, sans-serif; max-width: 480px; margin: 10vh auto; padding: 0 16px; }
      h1 { font-size: 1.3rem; }
      input { display: block; width: 100%; box-sizing: border-box; padding: 10px; margin: 6px 0 14px; font-size: 1rem; }
      button { padding: 10px 20px; font-size: 1rem; cursor: pointer; }
      #result { margin-top: 16px; padding: 12px; border-radius: 6px; display: none; }
      #result.queued { background: #1e7d3222; display: block; }
      #result.pending { background: #a6740022; display: block; }
      #result.not_found, #result.error { background: #a6000022; display: block; }
    </style></head>
    <body>
    <h1>Grab one song</h1>
    <form id="f">
      <label>Artist<input name="artist" required autocomplete="off"></label>
      <label>Song title<input name="song" required autocomplete="off"></label>
      <button type="submit">Grab it</button>
    </form>
    <div id="result"></div>
    <script>
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      const btn = f.querySelector('button');
      const result = document.getElementById('result');
      btn.disabled = true; btn.textContent = 'Searching...';
      result.className = ''; result.style.display = 'none';
      try {
        const resp = await fetch('/grab', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({artist: f.artist.value, song: f.song.value})
        });
        const data = await resp.json();
        result.className = data.status;
        if (data.status === 'queued') {
          result.textContent = `Queued "${data.album}" by ${data.artist} -- it'll show up in Navidrome in a bit.`;
        } else {
          result.textContent = data.message;
        }
      } catch (err) {
        result.className = 'error';
        result.textContent = 'Request failed: ' + err;
      } finally {
        btn.disabled = false; btn.textContent = 'Grab it';
      }
    });
    </script>
    </body></html>"""
    
    
    class Handler(BaseHTTPRequestHandler):
        def log_message(self, fmt, *args):
            print("%s - %s" % (self.address_string(), fmt % args))
    
        def do_GET(self):
            if self.path == "/":
                body = PAGE.encode()
                self.send_response(200)
                self.send_header("Content-Type", "text/html; charset=utf-8")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            else:
                self.send_response(404)
                self.end_headers()
    
        def do_POST(self):
            if self.path != "/grab":
                self.send_response(404)
                self.end_headers()
                return
            length = int(self.headers.get("Content-Length", 0))
            try:
                payload = json.loads(self.rfile.read(length))
                artist = payload["artist"].strip()
                song = payload["song"].strip()
                if not artist or not song:
                    raise ValueError("artist and song are required")
                result = grab(artist, song)
            except urllib.error.HTTPError as e:
                result = {"status": "error", "message": f"Lidarr API error: {e}"}
            except Exception as e:
                result = {"status": "error", "message": str(e)}
            body = json.dumps(result).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)
    
    
    if __name__ == "__main__":
        print(f"quickplay listening on :{PORT}")
        ThreadingHTTPServer(("0.0.0.0", PORT), Handler).serve_forever()
