apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-bucket-module
  namespace: crossplane-system
  annotations:
    crossplane.io/terraform-module: "true"
    argocd.argoproj.io/sync-wave: "15"
data:
  main.tf: |
    terraform {
      required_providers {
        garage = {
          source  = "arsolitt/garagehq"
          version = ">= 0.0.1"
        }
      }
    }

    provider "garage" {
      host   = var.garage_host
      scheme = var.garage_scheme
      token  = var.garage_token
    }

    # Create the bucket
    resource "garage_bucket" "bucket" {
      global_alias = var.bucket_name
    }

    # Create an access key
    resource "garage_key" "key" {
      name = var.key_name
    }

    # Grant permissions to the key
    resource "garage_bucket_key" "bucket_key" {
      bucket_id     = garage_bucket.bucket.id
      access_key_id = garage_key.key.access_key_id
      read          = var.read_access
      write         = var.write_access
      owner         = var.owner_access
    }

    # Outputs for Kubernetes secret
    output "bucket_id" {
      value = garage_bucket.bucket.id
    }

    output "access_key_id" {
      value = garage_key.key.access_key_id
    }

    output "secret_access_key" {
      value     = garage_key.key.secret_access_key
      sensitive = true
    }

  variables.tf: |
    variable "garage_host" {
      type        = string
      description = "Garage Admin API host (e.g., garage.garage.svc:3903)"
    }

    variable "garage_scheme" {
      type        = string
      default     = "http"
      description = "Scheme for Garage API (http or https)"
    }

    variable "garage_token" {
      type        = string
      sensitive   = true
      description = "Garage Admin API token"
    }

    variable "bucket_name" {
      type        = string
      description = "Global alias for the bucket"
    }

    variable "key_name" {
      type        = string
      description = "Name for the access key"
    }

    variable "read_access" {
      type        = bool
      default     = true
      description = "Grant read access"
    }

    variable "write_access" {
      type        = bool
      default     = true
      description = "Grant write access"
    }

    variable "owner_access" {
      type        = bool
      default     = false
      description = "Grant owner access"
    }