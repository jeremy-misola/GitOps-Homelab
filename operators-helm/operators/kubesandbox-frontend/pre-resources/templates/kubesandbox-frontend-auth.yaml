apiVersion: tf.upbound.io/v1beta1
kind: Workspace
metadata:
  name: kubesandbox-frontend-auth
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "17"
spec:
  forProvider:
    source: Inline
    module: |
      terraform {
        required_providers {
          authentik = {
            source  = "goauthentik/authentik"
            version = "~> 2025.2.0"
          }
        }
      }

      variable "authentik_url" {
        type = string
      }

      variable "authentik_token" {
        type      = string
        sensitive = true
      }

      variable "authorization_flow" {
        type = string
      }

      variable "invalidation_flow" {
        type = string
      }

      # Name of the Authentik certificate-keypair used to RS256-sign this
      # provider's tokens. WITHOUT this, the provider publishes an empty JWKS
      # ({}) and the Envoy JWT SecurityPolicy on /api cannot verify the SPA's
      # bearer -> "Jwks remote fetch is failed" (401). Must match the backend's
      # signing_key_name so both /jwks/ endpoints resolve.
      variable "signing_key_name" {
        type = string
      }

      provider "authentik" {
        url   = var.authentik_url
        token = var.authentik_token
      }

      data "authentik_flow" "authorization" {
        slug = var.authorization_flow
      }

      data "authentik_flow" "invalidation" {
        slug = var.invalidation_flow
      }

      data "authentik_certificate_key_pair" "signing" {
        name = var.signing_key_name
      }

      resource "authentik_provider_oauth2" "kubesandbox_frontend" {
        name               = "KubeSandbox Frontend"
        client_id          = "kubesandbox-frontend"
        authorization_flow = data.authentik_flow.authorization.id
        invalidation_flow  = data.authentik_flow.invalidation.id
        # PUBLIC client: the browser SPA runs Authorization Code + PKCE and cannot
        # safely hold a client_secret. See kubesandbox docs/06-frontend-architecture.md
        # §4.1. A public client issues no secret; the client-secret output below is
        # therefore empty and unused (the frontend chart's edge OIDC is disabled).
        client_type        = "public"

        # RS256-signed JWTs via the per-provider JWKS endpoint. Required so the
        # Envoy JWT SecurityPolicy on /api can validate the SPA's bearer token.
        # (JWKS is only populated when an asymmetric signing key is set.)
        signing_key = data.authentik_certificate_key_pair.signing.id
        issuer_mode = "per_provider"

        # Match the backend provider so `sub` is the same hashed uid for a given
        # user across both clients -> ownerRef checks on /api and /s/{id} line up.
        sub_mode = "hashed_user_id"

        allowed_redirect_uris = [
          {
            matching_mode = "strict"
            url           = "https://kubesandbox.com/auth/callback"
          }
        ]
      }

      resource "authentik_application" "kubesandbox_frontend" {
        name               = "KubeSandbox"
        slug               = "kubesandbox-frontend"
        protocol_provider  = authentik_provider_oauth2.kubesandbox_frontend.id
        policy_engine_mode = "any"
        meta_launch_url    = "https://kubesandbox.com"
      }

      output "client-id" {
        value = authentik_provider_oauth2.kubesandbox_frontend.client_id
      }

      output "client-secret" {
        value     = authentik_provider_oauth2.kubesandbox_frontend.client_secret
        sensitive = true
      }

    vars:
      - key: authentik_url
        value: "https://auth{{ .Values.envSuffix }}.jeremymr.dev"
      - key: authorization_flow
        value: "default-provider-authorization-explicit-consent"
      - key: invalidation_flow
        value: "default-provider-invalidation-flow"
      - key: signing_key_name
        value: {{ .Values.signingKeyName | default "authentik Self-signed Certificate" | quote }}

    env:
      - name: TF_VAR_authentik_token
        secretKeyRef:
          namespace: crossplane-system
          name: authentik-api-token
          key: token

  writeConnectionSecretToRef:
    name: kubesandbox-frontend-client-secret
    namespace: kubesandbox

  providerConfigRef:
    name: terraform-config
