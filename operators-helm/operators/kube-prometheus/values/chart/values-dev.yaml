gatewayName: dev-web
envSuffix: ""
authentikUrl: https://auth.jeremymr.dev

defaultRules:
  create: true
additionalPrometheusRulesMap:
  custom-alerts:
    groups:
      - name: custom-node-pressure
        rules:
          - alert: NodePressure
            expr: |
              max by (node, condition) (
                kube_node_status_condition{condition=~"MemoryPressure|DiskPressure|PIDPressure", status="true"} == 1
              )
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Node pressure on {{ $labels.node }}"
              description: "Node {{ $labels.node }} has {{ $labels.condition }} for more than 10 minutes."
      - name: custom-service-downtime
        rules:
          - alert: BlackboxTargetDown
            expr: probe_success{job=~"argocd|kleff"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Blackbox probe failed for {{ $labels.job }}"
              description: "The monitored target {{ $labels.job }} has been failing probes for more than 5 minutes."
alertmanager:
  alertmanagerSpec:
    alertmanagerConfiguration:
      name: discord-alertmanager-config
grafana:
  sidecar:
    datasources:
      watchMethod: LIST
    dashboards:
      watchMethod: LIST
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-helm-gateway.loki.svc.cluster.local:80
      jsonData:
        timeout: "300"
        maxLines: 1000
        httpHeaderName1: X-Scope-OrgID
      secureJsonData:
        httpHeaderValue1: "1"

    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo-helm.tempo.svc.cluster.local:3100
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
      secretKeyRef:
        name: grafana-client-secret
        key: client-id
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-client-secret
        key: client-secret
  admin:
    existingSecret: "grafana-secret"
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    server:
      root_url: "https://grafana-dev.jeremymr.dev"
    dataproxy:
      timeout: 300
    auth:
      signout_redirect_url: "https://auth-dev.jeremymr.dev/application/o/grafana/end-session/"
      oauth_auto_login: true
    auth.generic_oauth:
      name: authentik
      enabled: true
      client_id: "${GF_AUTH_GENERIC_OAUTH_CLIENT_ID}"
      client_secret: "${GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}"
      scopes: "openid profile email"
      auth_url: "https://auth-dev.jeremymr.dev/application/o/authorize/"
      token_url: "https://auth-dev.jeremymr.dev/application/o/token/"
      api_url: "https://auth-dev.jeremymr.dev/application/o/userinfo"
      email_attribute_path: email
      login_attribute_path: preferred_username
      name_attribute_path: name
      # Optionally map user groups to Grafana roles
      role_attribute_path: contains(groups, 'Grafana Admins') && 'Admin' || contains(groups, 'Grafana Editors') && 'Editor' || 'Viewer'
prometheus:
  prometheusSpec:
    remoteWrite:
      # Cross-cluster: dev Prometheus → prod Mimir via its dedicated MetalLB IP.
      - url: http://192.168.0.241/api/v1/push
        headers:
          X-Scope-OrgID: dev
    externalLabels:
      cluster: dev
