apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
  namespace: monitoring
spec:
  parentRefs:
  - name: {{ .Values.gatewayName }}
    namespace: envoy-gateway-system
  hostnames:
    - grafana{{ .Values.envSuffix }}.jeremymr.dev
  rules:
  - backendRefs:
    - name: kube-prometheus-grafana
      port: 80
    timeouts:
      request: "60s"
