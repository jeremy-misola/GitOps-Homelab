apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: headlamp-oidc-config
  namespace: {{ .Release.Namespace }}
  annotations:
    # Crossplane creates the secret, so we need to ensure it exists first
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: headlamp-route
  oidc:
    provider:
      issuer: "https://auth{{ .Values.envSuffix }}.jeremymr.dev/application/o/headlamp/"
    # Client ID and Secret are managed by Crossplane Workspace in pre-resources
    # Secret keys must be "client-id" and "client-secret" (hyphens, not underscores)
    clientIDRef:
      name: headlamp-client-secret
    clientSecret:
      name: headlamp-client-secret
    redirectURL: "https://headlamp{{ .Values.envSuffix }}.jeremymr.dev/oauth2/callback"
    logoutPath: "/logout"
