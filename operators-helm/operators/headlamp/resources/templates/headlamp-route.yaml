apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp-route
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
  - name: {{ .Values.gatewayName }}
    namespace: envoy-gateway-system
  hostnames:
    - headlamp{{ .Values.envSuffix }}.jeremymr.dev
  rules:
  - backendRefs:
    - name: headlamp-helm-headlamp
      port: 80
