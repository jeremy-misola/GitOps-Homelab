apiVersion: tf.upbound.io/v1beta1
kind: Workspace
metadata:
  name: kubesandbox-backend-auth
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "17"
spec:
  forProvider:
    source: Inline
    module: |
      terraform {
        required_providers {
          authentik = {
            source  = "goauthentik/authentik"
            version = "~> 2025.2.0"
          }
          random = {
            source  = "hashicorp/random"
            version = "~> 3.0"
          }
        }
      }

      variable "authentik_url" {
        type = string
      }

      variable "authentik_token" {
        type      = string
        sensitive = true
      }

      variable "authorization_flow" {
        type = string
      }

      variable "invalidation_flow" {
        type = string
      }

      # Name of the certificate-key pair Authentik uses to sign the OAuth2
      # access/ID tokens (RS256). A signing key is REQUIRED here for two reasons:
      #   1. The Envoy JWT SecurityPolicy on /api validates bearer tokens against
      #      this provider's JWKS endpoint, which is only populated when an
      #      asymmetric key is configured.
      #   2. The backend-owned session auth (G2 Option B) parses the ID token
      #      returned during the PKCE code exchange; RS256 + per_provider issuer
      #      mode ensures a stable, resolvable JWKS if JWKS validation is added later.
      # Defaults to the built-in self-signed cert; override if yours differs.
      variable "signing_key_name" {
        type = string
      }

      provider "authentik" {
        url   = var.authentik_url
        token = var.authentik_token
      }

      data "authentik_flow" "authorization" {
        slug = var.authorization_flow
      }

      data "authentik_flow" "invalidation" {
        slug = var.invalidation_flow
      }

      data "authentik_certificate_key_pair" "signing" {
        name = var.signing_key_name
      }

      # Session cookie signing secret — generated once and never rotated by
      # Terraform (lifecycle ignore_changes). The same secret is used to sign and
      # verify kubesandbox session cookies (G2 Option B) and PKCE state tokens.
      # Rotating this value invalidates all active sessions.
      resource "random_password" "session_secret" {
        length  = 64
        special = false # URL-safe; no quoting issues in env vars or YAML

        lifecycle {
          ignore_changes = all # Generate once; do not regenerate on re-apply.
        }
      }

      resource "authentik_provider_oauth2" "kubesandbox_backend" {
        name               = "KubeSandbox Backend"
        client_id          = "kubesandbox-backend"
        authorization_flow = data.authentik_flow.authorization.id
        invalidation_flow  = data.authentik_flow.invalidation.id
        client_type        = "confidential"

        # RS256-signed JWTs via the per-provider JWKS endpoint. Required for the
        # Envoy JWT SecurityPolicy on /api (JWKS is only populated with an
        # asymmetric signing key).
        signing_key = data.authentik_certificate_key_pair.signing.id
        issuer_mode = "per_provider"

        # /oauth2/callback — the backend-owned PKCE callback (G2 Option B).
        # The backend receives ?code=...&state=..., exchanges the code for tokens,
        # sets an HMAC-signed session cookie, and redirects to the original URL.
        allowed_redirect_uris = [
          {
            matching_mode = "strict"
            url           = "https://kubesandbox.com/oauth2/callback"
          }
        ]

        # Authorization codes are consumed immediately by the backend's token
        # exchange; keep validity short to match the signed state token TTL.
        access_code_validity = "minutes=5"
      }

      resource "authentik_application" "kubesandbox_backend" {
        name               = "KubeSandbox Backend"
        slug               = "kubesandbox-backend"
        protocol_provider  = authentik_provider_oauth2.kubesandbox_backend.id
        policy_engine_mode = "any"
        meta_launch_url    = "https://kubesandbox.com"
      }

      # --- Outputs ---
      # Crossplane writes all outputs to the Secret named in writeConnectionSecretToRef
      # (kubesandbox-backend-client-secret, namespace kubesandbox). Keys:
      #   client-id      — OAuth2 client_id
      #   client-secret  — OAuth2 client_secret (sensitive)
      #   session-secret — HMAC key for session cookies + PKCE state (sensitive)
      #   issuer-url     — provider issuer URL for the JWT SecurityPolicy
      #   jwks-uri       — JWKS endpoint for the JWT SecurityPolicy

      output "client-id" {
        value = authentik_provider_oauth2.kubesandbox_backend.client_id
      }

      output "client-secret" {
        value     = authentik_provider_oauth2.kubesandbox_backend.client_secret
        sensitive = true
      }

      output "session-secret" {
        value     = random_password.session_secret.result
        sensitive = true
      }

      # Issuer + JWKS URLs consumed by the backend chart's JWT SecurityPolicy
      # (authentication.jwt.*) and by the sessionAuth.oidc.* values.
      output "issuer-url" {
        value = "${var.authentik_url}/application/o/${authentik_application.kubesandbox_backend.slug}/"
      }

      output "jwks-uri" {
        value = "${var.authentik_url}/application/o/${authentik_application.kubesandbox_backend.slug}/jwks/"
      }

    vars:
      - key: authentik_url
        value: "https://auth{{ .Values.envSuffix }}.jeremymr.dev"
      - key: authorization_flow
        # Consent-only flow (authentication=require_authenticated). Critical for
        # the /s/{id}/ (vcluster) ext-authz redirect: when the backend /authz
        # bounces an unauthenticated request to Authentik, this flow honors the
        # user's existing SSO session and redirects straight back to
        # /oauth2/callback -- no second login. The old kubesandbox-authorization
        # flow (authentication=none + identification+password) forced users to
        # sign in again every time they opened a sandbox.
        value: "default-provider-authorization-implicit-consent"
      - key: invalidation_flow
        value: "default-provider-invalidation-flow"
      - key: signing_key_name
        value: {{ .Values.signingKeyName | default "authentik Self-signed Certificate" | quote }}

    env:
      - name: TF_VAR_authentik_token
        secretKeyRef:
          namespace: crossplane-system
          name: authentik-api-token
          key: token

  writeConnectionSecretToRef:
    name: kubesandbox-backend-client-secret
    namespace: kubesandbox

  providerConfigRef:
    name: terraform-config
