apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: "{{ .Values.gatewayName }}"
  namespace: envoy-gateway-system
spec:
  infrastructure:
    labels:
      gateway: envoy
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: "{{ .Values.gatewayName }}-config"
  gatewayClassName: envoy
  addresses:
  - type: IPAddress
    value: "{{ .Values.gatewayAddress }}"
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All

  - name: https
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
        - name: homelab-cert
          namespace: envoy-gateway-system
    allowedRoutes:
      namespaces:
        from: All
