apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-route
  namespace: argocd
spec:
  parentRefs:
  - name: "{{ .Values.gatewayName }}"
    namespace: envoy-gateway-system
  hostnames:
    - argocd{{ .Values.envSuffix }}.jeremymr.dev
  rules:
  - backendRefs:
    - name: argocd-server
      port: 80
