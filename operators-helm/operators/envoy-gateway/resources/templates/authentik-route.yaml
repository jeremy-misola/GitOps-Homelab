apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik-route
  namespace: authentik
spec:
  parentRefs:
  - name: {{ .Values.gatewayName }}
    namespace: envoy-gateway-system
  hostnames:
    - auth{{ .Values.envSuffix }}.jeremymr.dev
  rules:
  - backendRefs:
    - name: authentik-server
      port: 80
