apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stirling-pdf-route
  namespace: stirling-pdf
spec:
  parentRefs:
  - name: "{{ .Values.gatewayName }}"
    namespace: envoy-gateway-system
  hostnames:
    - stirling-pdf{{ .Values.envSuffix }}.jeremymr.dev
  rules:
  - backendRefs:
    - name: stirling-pdf
      port: 8080