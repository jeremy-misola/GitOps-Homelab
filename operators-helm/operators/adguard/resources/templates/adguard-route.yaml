apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: adguard-route
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
  - name: {{ .Values.gatewayName }}
    namespace: envoy-gateway-system
  hostnames:
    - adguard{{ .Values.envSuffix }}.jeremymr.dev
  rules:
  - backendRefs:
    - name: adguard-helm-adguard-home
      port: 3000
