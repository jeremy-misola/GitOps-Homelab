fullnameOverride: home-assistant

env:
  - name: TZ
    value: America/Toronto

service:
  type: ClusterIP
  port: 8123

httpRoute:
  enabled: true
  parentRefs:
    - name: dev-web
      namespace: envoy-gateway-system
  hostnames:
    - home-assistant-dev.jeremymr.dev

persistence:
  enabled: true
  size: 10Gi

configuration:
  enabled: true

initContainers:
  - name: install-hacs
    image: ubuntu:24.04
    command:
      - /bin/bash
      - -lc
      - |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends wget ca-certificates
        mkdir -p /config/custom_components
        cd /tmp
        wget -O - https://get.hacs.xyz | bash -
        rm -rf /config/custom_components/hacs
        cp -R /tmp/hacs /config/custom_components/hacs
    volumeMounts:
      - name: home-assistant
        mountPath: /config
      - name: hacs-tmp
        mountPath: /tmp

additionalVolumes:
  - name: hacs-tmp
    emptyDir: {}

additionalMounts:
  - name: hacs-tmp
    mountPath: /tmp

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 768Mi
