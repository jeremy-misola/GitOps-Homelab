apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: soularr-lidarr-credentials
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: soularr-lidarr-credentials
    creationPolicy: Owner
  data:
  - secretKey: apiKey
    remoteRef:
      key: LIDARR_API_KEY
