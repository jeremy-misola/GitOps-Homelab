  namespace: kleff-deployment
spec:
  parentRefs:
  - name: prod-web
    namespace: envoy-gateway-system
  hostnames:
  - "portfolio.jeremymr.dev"
  rules:
  - backendRefs:
    - name: portfolio-frontend
      port: 80