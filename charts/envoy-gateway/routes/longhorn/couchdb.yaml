apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: couchdb-route
  namespace: couchdb
spec:
  parentRefs:
  - name: prod-web
    namespace: envoy-gateway-system
  hostnames:
    - couchdb.jeremymr.dev
  rules:
  - backendRefs:
    - name: couchdb-svc-couchdb
      port: 5984
