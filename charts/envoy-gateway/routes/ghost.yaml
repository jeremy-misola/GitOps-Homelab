apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ghost-route
  namespace: ghost
spec:
  parentRefs:
  - name: prod-web
    namespace: envoy-gateway-system
  hostnames:
    - ghost.jeremymr.dev
  rules:
  - backendRefs:
    - name: ghost
      port: 80

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: admin-ghost-route
  namespace: ghost
spec:
  parentRefs:
  - name: prod-web
    namespace: envoy-gateway-system
  hostnames:
    - admin.ghost.jeremymr.dev
  rules:
  - backendRefs:
    - name: ghost
      port: 80