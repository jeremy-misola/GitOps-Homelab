apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-route
  namespace: kleff-deployment
spec:
  parentRefs:
  - name: prod-web
    namespace: envoy-gateway-system
  hostnames:
  - "kleff.io"
  rules:
  - backendRefs:
    - name: kleff-frontend
      port: 80

---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: microservices-route
  namespace: kleff-deployment
spec:
  parentRefs:
  - name: prod-web
    namespace: envoy-gateway-system
  hostnames:
  - "api.kleff.io"
  rules:
  # 1. Specific User Exception (Route to Project Service)
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/users/me/invitations
    backendRefs:
    - name: project-management-service
      port: 80
  
  # 2. General User Service
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/users
    backendRefs:
    - name: user-service
      port: 80

  # 3. Project Management Service - Combined Rules
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/projects
    - path:
        type: PathPrefix
        value: /api/v1/invitations
    - path:
        type: PathPrefix
        value: /api/v1/collaborators  # Added this for your CollaboratorController
    - path:
        type: PathPrefix
        value: /api/v1/custom-roles    # Added this for your CustomRoleController
    backendRefs:
    - name: project-management-service
      port: 80

  # 4. Other Services
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/containers
    backendRefs:
    - name: deployment-service
      port: 80
  
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/build
    backendRefs:
    - name: deployment-backend-service
      port: 80

  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/billing
    backendRefs:
    - name: billing-service
      port: 80

  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/systems
    backendRefs:
    - name: kleff-observability
      port: 80

  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/hello
    backendRefs:
    - name: deployment-backend-service
      port: 80