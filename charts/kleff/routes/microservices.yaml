apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-route
  namespace: kleff-deployment
spec:
  parentRefs:
  - name: prod-web
    namespace: envoy-gateway-system
  hostnames:
  - "kleff.io"
  rules:
  - backendRefs:
    - name: kleff-frontend
      port: 80

---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: microservices-route
  namespace: kleff-deployment
spec:
  parentRefs:
  - name: prod-web
    namespace: envoy-gateway-system
  hostnames:
  - "api.kleff.io"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/users
    backendRefs:
    - name: user-service
      port: 80

  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/projects
    backendRefs:
    - name: project-management-service
      port: 80

  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/containers
    backendRefs:
    - name: deployment-service
      port: 80
  
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/build
    backendRefs:
    - name: deployment-backend-service
      port: 80

  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/billing
    backendRefs:
    - name: billing-service
      port: 80

  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/systems
    backendRefs:
    - name: kleff-observability
      port: 80
