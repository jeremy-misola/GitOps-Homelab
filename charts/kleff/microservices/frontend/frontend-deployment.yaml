apiVersion: apps/v1
kind: Deployment
metadata:
  name: kleff-frontend
  namespace: kleff-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kleff-frontend
  template:
    metadata:
      labels:
        app: kleff-frontend
        paas: kleff
    spec:
      imagePullSecrets:
        - name: acr-creds
      containers:
        - name: kleff-frontend
          image: kleff.azurecr.io/frontend:ca5c2b6414400c0f31afcf4346d5d78ec79dab34
          env:
            - name: VITE_AUTH_CLIENT_ID
              value: "8qNA2sSV88fusOocZcMj6GirTLWYygdAXnmtLUfe"
            - name: VITE_BACKEND_URL
              value: https://api.kleff.io
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: kleff-frontend
  namespace: kleff-deployment
spec:
  selector:
    app: kleff-frontend
  ports:
    - name: http
      port: 80
      targetPort: 3000
