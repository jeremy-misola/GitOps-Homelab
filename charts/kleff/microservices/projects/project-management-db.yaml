apiVersion: v1
kind: Service
metadata:
  name: project-management-db
  namespace: kleff-deployment
spec:
  ports:
  - port: 5432
  selector:
    app: project-management-db
  clusterIP: None 
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: project-management-db
  namespace: kleff-deployment
spec:
  serviceName: "project-management-db"
  replicas: 1
  selector:
    matchLabels:
      app: project-management-db
  template:
    metadata:
      labels:
        app: project-management-db
    spec:
      containers:
      - name: postgres
        image: postgres:16
        env:
        - name: POSTGRES_DB
          value: mydb
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: project_management_db_password 
        ports:
        - containerPort: 5432
          name: postgres
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: db-data
    spec:
      storageClassName: longhorn 
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi