apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: kleff-deployment
spec:
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Endpoints
metadata:
  name: api-gateway
  namespace: kleff-deployment
subsets:
  - addresses:
      - ip: 192.168.0.241
    ports:
      - port: 80