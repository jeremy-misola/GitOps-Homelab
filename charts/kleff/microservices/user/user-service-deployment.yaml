apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: kleff-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
        paas: kleff
    spec:
      imagePullSecrets:
        - name: acr-creds
      containers:
        - name: user-service
          image: kleff.azurecr.io/user-service:e0e100f296a10e11da8d5dca127255ad56aae6c7
          env:
            # 1. Port Configuration
            - name: HTTP_ADDR
              value: ":8080"
            - name: AUTHENTIK_BASE_URL
              # 2. Auth Configuration (Mapped from old OAUTH2_ISSUER_URI)

              value: "https://auth.kleff.io"
            - name: DB_PASSWORD
              # 3. Database Credentials (Helper variable to fetch the secret)

              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: user_db_password
            - name: POSTGRES_USER_DSN
              # 4. Primary Database DSN

              # Format: postgres://username:password@host:port/dbname?sslmode=disable
              value: "postgres://user_service:$(DB_PASSWORD)@user-db:5432/user_service?sslmode=disable"
            - name: POSTGRES_AUDIT_DSN
              # 5. Audit Database DSN (Pointing to same DB for now, or change as needed)

              value: "postgres://user_service:$(DB_PASSWORD)@user-db:5432/user_service?sslmode=disable"
            - name: AUTHENTIK_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials # Create this secret
                  key: authentik_admin_token
            - name: DEFAULT_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: default_admin_email
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: kleff-deployment
spec:
  selector:
    app: user-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
