apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: kleff-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
        paas: kleff
    spec:
      imagePullSecrets:
        - name: acr-creds
      containers:
        - name: user-service
          image: kleff.azurecr.io/user-service:7dd6bdef043938632f59c6efc101f8dbc54944ef
          env:
            # 1. Port Configuration
            - name: HTTP_ADDR
              value: ":8080"
            - name: AUTHENTIK_BASE_URL
              # 2. Auth Configuration (Mapped from old OAUTH2_ISSUER_URI)

              value: "https://auth.kleff.io"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: user-db-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-db-app
                  key: password
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: user-db-app
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: user-db-app
                  key: port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: user-db-app
                  key: dbname
            - name: POSTGRES_USER_DSN
              # Format: postgres://username:password@host:port/dbname?sslmode=disable
              value: "postgres://$(DB_USERNAME):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?sslmode=disable"
            - name: POSTGRES_AUDIT_DSN
              # Audit Database DSN (Pointing to same DB for now, or change as needed)
              value: "postgres://$(DB_USERNAME):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?sslmode=disable"
            - name: AUTHENTIK_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials # Create this secret
                  key: authentik_admin_token
            - name: DEFAULT_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: default_admin_email
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: kleff-deployment
spec:
  selector:
    app: user-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
