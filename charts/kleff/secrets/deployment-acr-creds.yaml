---

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kleff-acr-repo-config
  namespace: argocd 
spec:
  secretStoreRef:
    name: doppler-secret-store-kleff
    kind: ClusterSecretStore
  target:
    name: kleff-acr-repo-config
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: helm
        url: kleff.azurecr.io/helm
        name: kleff-acr
        enableOCI: "true"
        username: "{{ .acr_username }}"
        password: "{{ .acr_password }}"
  data:
  - secretKey: acr_username
    remoteRef:
      key: ACR_USERNAME
  - secretKey: acr_password
    remoteRef:
      key: ACR_PASSWORD1