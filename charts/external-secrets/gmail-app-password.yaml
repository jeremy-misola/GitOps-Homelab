apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gmail-app-password
  namespace: ghost
spec:
  secretStoreRef:
    name: doppler-secret-store
    kind: ClusterSecretStore
  target:
    name: gmail-app-password
    creationPolicy: Owner
  data:
  - secretKey: app-password
    remoteRef:
      key: GMAIL_APP_PASSWORD

---

