apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: kubesandbox-session
  annotations:
    argocd.argoproj.io/sync-wave: "18"
spec:
  compositeTypeRef:
    apiVersion: platform.kubesandbox.com/v1alpha1
    kind: XKubeSandboxSession
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: session-namespace
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              metadata:
                name: placeholder
                annotations:
                  argocd.argoproj.io/sync-wave: "18"
              spec:
                providerConfigRef:
                  name: kubernetes-incluster
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Namespace
                    metadata:
                      name: placeholder
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.labels[crossplane.io/claim-namespace]
                    - fromFieldPath: metadata.labels[crossplane.io/claim-name]
                  strategy: string
                  string:
                    fmt: "%s-%s-namespace"
                toFieldPath: metadata.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.labels[crossplane.io/claim-namespace]
                    - fromFieldPath: metadata.labels[crossplane.io/claim-name]
                  strategy: string
                  string:
                    fmt: "%s-%s"
                toFieldPath: spec.forProvider.manifest.metadata.name
              - type: ToCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: status.sessionNamespace

          - name: vcluster-release
            base:
              apiVersion: helm.crossplane.io/v1beta1
              kind: Release
              metadata:
                name: placeholder
                annotations:
                  argocd.argoproj.io/sync-wave: "18"
              spec:
                providerConfigRef:
                  name: helm-incluster
                forProvider:
                  chart:
                    name: vcluster
                    repository: https://charts.loft.sh
                  namespace: placeholder
                  skipCreateNamespace: true
                  values:
                    {}
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.labels[crossplane.io/claim-namespace]
                    - fromFieldPath: metadata.labels[crossplane.io/claim-name]
                  strategy: string
                  string:
                    fmt: "%s-%s-vcluster"
                toFieldPath: metadata.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.labels[crossplane.io/claim-namespace]
                    - fromFieldPath: metadata.labels[crossplane.io/claim-name]
                  strategy: string
                  string:
                    fmt: "%s-%s"
                toFieldPath: spec.forProvider.namespace
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.labels[crossplane.io/claim-namespace]
                    - fromFieldPath: metadata.labels[crossplane.io/claim-name]
                    - fromFieldPath: metadata.labels[crossplane.io/claim-namespace]
                    - fromFieldPath: metadata.labels[crossplane.io/claim-name]
                  strategy: string
                  string:
                    fmt: "https://%s-%s-vcluster.%s-%s:443"
                toFieldPath: spec.forProvider.values.exportKubeConfig.server
              - type: ToCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: status.vclusterRelease

          - name: shell-networkpolicy
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              metadata:
                name: placeholder
                annotations:
                  argocd.argoproj.io/sync-wave: "18"
              spec:
                providerConfigRef:
                  name: kubernetes-incluster
                forProvider:
                  manifest:
                    apiVersion: networking.k8s.io/v1
                    kind: NetworkPolicy
                    metadata:
                      name: shell-networkpolicy
                      namespace: placeholder
                    spec:
                      podSelector:
                        matchLabels:
                          app: shell
                      policyTypes:
                        - Ingress
                        - Egress
                      ingress:
                        - from:
                            - namespaceSelector:
                                matchLabels:
                                  kubernetes.io/metadata.name: envoy-gateway-system
                          ports:
                            - protocol: TCP
                              port: 8080
                      egress:
                        - to:
                            - namespaceSelector:
                                matchLabels:
                                  kubernetes.io/metadata.name: placeholder
                          ports:
                            - protocol: TCP
                              port: 443
                            - protocol: TCP
                              port: 8443
                        - to:
                            - namespaceSelector:
                                matchLabels:
                                  kubernetes.io/metadata.name: placeholder
                          ports:
                            - protocol: TCP
                              port: 53
                            - protocol: UDP
                              port: 53
                        - to:
                            - namespaceSelector:
                                matchLabels:
                                  kubernetes.io/metadata.name: kube-system
                          ports:
                            - protocol: TCP
                              port: 53
                            - protocol: UDP
                              port: 53
                        - to:
                            - ipBlock:
                                cidr: 0.0.0.0/0
                          ports:
                            - protocol: TCP
                              port: 80
                            - protocol: TCP
                              port: 443
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.labels[crossplane.io/claim-namespace]
                    - fromFieldPath: metadata.labels[crossplane.io/claim-name]
                  strategy: string
                  string:
                    fmt: "%s-%s-networkpolicy"
                toFieldPath: metadata.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.labels[crossplane.io/claim-namespace]
                    - fromFieldPath: metadata.labels[crossplane.io/claim-name]
                  strategy: string
                  string:
                    fmt: "%s-%s"
                toFieldPath: spec.forProvider.manifest.metadata.namespace
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.labels[crossplane.io/claim-namespace]
                    - fromFieldPath: metadata.labels[crossplane.io/claim-name]
                  strategy: string
                  string:
                    fmt: "%s-%s"
                toFieldPath: spec.forProvider.manifest.spec.egress[0].to[0].namespaceSelector.matchLabels[kubernetes.io/metadata.name]

          - name: shell-serviceaccount
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              metadata:
                name: placeholder
                annotations:
                  argocd.argoproj.io/sync-wave: "18"
              spec:
                providerConfigRef:
                  name: kubernetes-incluster
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ServiceAccount
                    metadata:
                      name: shell
                      namespace: placeholder
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.labels[crossplane.io/claim-namespace]
                    - fromFieldPath: metadata.labels[crossplane.io/claim-name]
                  strategy: string
                  string:
                    fmt: "%s-%s-shell-serviceaccount"
                toFieldPath: metadata.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.labels[crossplane.io/claim-namespace]
                    - fromFieldPath: metadata.labels[crossplane.io/claim-name]
                  strategy: string
                  string:
                    fmt: "%s-%s"
                toFieldPath: spec.forProvider.manifest.metadata.namespace

          - name: shell-role
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              metadata:
                name: placeholder
                annotations:
                  argocd.argoproj.io/sync-wave: "18"
              spec:
                providerConfigRef:
                  name: kubernetes-incluster
                forProvider:
                  manifest:
                    apiVersion: rbac.authorization.k8s.io/v1
                    kind: Role
                    metadata:
                      name: shell
                      namespace: placeholder
                    rules:
                      - apiGroups:
                          - ""
                        resources:
                          - pods
                          - pods/log
                          - services
                          - endpoints
                          - configmaps
                          - secrets
                          - events
                        verbs:
                          - get
                          - list
                          - watch
                      - apiGroups:
                          - apps
                        resources:
                          - deployments
                          - replicasets
                          - statefulsets
                        verbs:
                          - get
                          - list
                          - watch
                      - apiGroups:
                          - batch
                        resources:
                          - jobs
                          - cronjobs
                        verbs:
                          - get
                          - list
                          - watch
                      - apiGroups:
                          - networking.k8s.io
                        resources:
                          - networkpolicies
                          - ingresses
                        verbs:
                          - get
                          - list
                          - watch
                      - apiGroups:
                          - gateway.networking.k8s.io
                        resources:
                          - httproutes
                          - gateways
                        verbs:
                          - get
                          - list
                          - watch
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.labels[crossplane.io/claim-namespace]
                    - fromFieldPath: metadata.labels[crossplane.io/claim-name]
                  strategy: string
                  string:
                    fmt: "%s-%s-shell-role"
                toFieldPath: metadata.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.labels[crossplane.io/claim-namespace]
                    - fromFieldPath: metadata.labels[crossplane.io/claim-name]
                  strategy: string
                  string:
                    fmt: "%s-%s"
                toFieldPath: spec.forProvider.manifest.metadata.namespace

          - name: shell-rolebinding
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              metadata:
                name: placeholder
                annotations:
                  argocd.argoproj.io/sync-wave: "18"
              spec:
                providerConfigRef:
                  name: kubernetes-incluster
                forProvider:
                  manifest:
                    apiVersion: rbac.authorization.k8s.io/v1
                    kind: RoleBinding
                    metadata:
                      name: shell
                      namespace: placeholder
                    roleRef:
                      apiGroup: rbac.authorization.k8s.io
                      kind: Role
                      name: shell
                    subjects:
                      - kind: ServiceAccount
                        name: shell
                        namespace: placeholder
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.labels[crossplane.io/claim-namespace]
                    - fromFieldPath: metadata.labels[crossplane.io/claim-name]
                  strategy: string
                  string:
                    fmt: "%s-%s-shell-rolebinding"
                toFieldPath: metadata.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.labels[crossplane.io/claim-namespace]
                    - fromFieldPath: metadata.labels[crossplane.io/claim-name]
                  strategy: string
                  string:
                    fmt: "%s-%s"
                toFieldPath: spec.forProvider.manifest.metadata.namespace
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.labels[crossplane.io/claim-namespace]
                    - fromFieldPath: metadata.labels[crossplane.io/claim-name]
                  strategy: string
                  string:
                    fmt: "%s-%s"
                toFieldPath: spec.forProvider.manifest.subjects[0].namespace

          - name: shell-pod
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              metadata:
                name: placeholder
                annotations:
                  argocd.argoproj.io/sync-wave: "18"
              spec:
                providerConfigRef:
                  name: kubernetes-incluster
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Pod
                    metadata:
                      name: shell
                      namespace: placeholder
                      labels:
                        app: shell
                    spec:
                      serviceAccountName: shell
                      restartPolicy: Never
                      containers:
                        - name: shell
                          image: jurassicjey/ttyd-k8s:ttyd
                          imagePullPolicy: IfNotPresent
                          resources: {}
                          command:
                            - sh
                            - -lc
                            - exec ttyd -W -p 8080 sh
                          env:
                            - name: KUBECONFIG
                              value: /kubeconfig/config
                          volumeMounts:
                            - name: vcluster-kubeconfig
                              mountPath: /kubeconfig
                              readOnly: true
                          ports:
                            - containerPort: 8080
                          stdin: true
                          tty: true
                      volumes:
                        - name: vcluster-kubeconfig
                          secret:
                            secretName: placeholder
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.labels[crossplane.io/claim-namespace]
                    - fromFieldPath: metadata.labels[crossplane.io/claim-name]
                  strategy: string
                  string:
                    fmt: "%s-%s-shell-pod"
                toFieldPath: metadata.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.labels[crossplane.io/claim-namespace]
                    - fromFieldPath: metadata.labels[crossplane.io/claim-name]
                  strategy: string
                  string:
                    fmt: "%s-%s"
                toFieldPath: spec.forProvider.manifest.metadata.namespace
              - type: FromCompositeFieldPath
                fromFieldPath: spec.workspaceImage
                toFieldPath: spec.forProvider.manifest.spec.containers[0].image
                policy:
                  fromFieldPath: Optional
              - type: FromCompositeFieldPath
                fromFieldPath: spec.resources.cpu
                toFieldPath: spec.forProvider.manifest.spec.containers[0].resources.requests.cpu
                policy:
                  fromFieldPath: Optional
              - type: FromCompositeFieldPath
                fromFieldPath: spec.resources.cpu
                toFieldPath: spec.forProvider.manifest.spec.containers[0].resources.limits.cpu
                policy:
                  fromFieldPath: Optional
              - type: FromCompositeFieldPath
                fromFieldPath: spec.resources.memory
                toFieldPath: spec.forProvider.manifest.spec.containers[0].resources.requests.memory
                policy:
                  fromFieldPath: Optional
              - type: FromCompositeFieldPath
                fromFieldPath: spec.resources.memory
                toFieldPath: spec.forProvider.manifest.spec.containers[0].resources.limits.memory
                policy:
                  fromFieldPath: Optional
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.labels[crossplane.io/claim-namespace]
                    - fromFieldPath: metadata.labels[crossplane.io/claim-name]
                  strategy: string
                  string:
                    fmt: "vc-%s-%s-vcluster"
                toFieldPath: spec.forProvider.manifest.spec.volumes[0].secret.secretName
              - type: ToCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: status.workspacePod
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.manifest.status.phase
                toFieldPath: status.phase
                transforms:
                  - type: map
                    map:
                      Pending: Provisioning
                      Running: Ready
                      Succeeded: Ready
                      Failed: Error
                      Unknown: Unknown
                policy:
                  fromFieldPath: Optional
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.manifest.status.phase
                toFieldPath: status.message
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "shell pod phase: %s"
                policy:
                  fromFieldPath: Optional
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.manifest.status.phase
                toFieldPath: status.workspaceReady
                transforms:
                  - type: map
                    map:
                      Running: true
                      Succeeded: true
                      Pending: false
                      Failed: false
                      Unknown: false
                policy:
                  fromFieldPath: Optional
            readinessChecks:
              - type: MatchString
                fieldPath: status.atProvider.manifest.status.phase
                matchString: Running

          - name: shell-service
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              metadata:
                name: placeholder
                annotations:
                  argocd.argoproj.io/sync-wave: "18"
              spec:
                providerConfigRef:
                  name: kubernetes-incluster
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Service
                    metadata:
                      name: shell
                      namespace: placeholder
                    spec:
                      type: ClusterIP
                      selector:
                        app: shell
                      ports:
                        - name: http
                          port: 80
                          targetPort: 8080
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.labels[crossplane.io/claim-namespace]
                    - fromFieldPath: metadata.labels[crossplane.io/claim-name]
                  strategy: string
                  string:
                    fmt: "%s-%s-shell-service"
                toFieldPath: metadata.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.labels[crossplane.io/claim-namespace]
                    - fromFieldPath: metadata.labels[crossplane.io/claim-name]
                  strategy: string
                  string:
                    fmt: "%s-%s"
                toFieldPath: spec.forProvider.manifest.metadata.namespace

          - name: shell-httproute
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              metadata:
                name: placeholder
                annotations:
                  argocd.argoproj.io/sync-wave: "18"
              spec:
                providerConfigRef:
                  name: kubernetes-incluster
                forProvider:
                  manifest:
                    apiVersion: gateway.networking.k8s.io/v1
                    kind: HTTPRoute
                    metadata:
                      name: shell
                      namespace: placeholder
                    spec:
                      parentRefs:
                        - name: kubesandbox
                          namespace: envoy-gateway-system
                      hostnames:
                        - placeholder
                      rules:
                        - backendRefs:
                            - name: shell
                              port: 80
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.labels[crossplane.io/claim-namespace]
                    - fromFieldPath: metadata.labels[crossplane.io/claim-name]
                  strategy: string
                  string:
                    fmt: "%s-%s-httproute"
                toFieldPath: metadata.name
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.labels[crossplane.io/claim-namespace]
                    - fromFieldPath: metadata.labels[crossplane.io/claim-name]
                  strategy: string
                  string:
                    fmt: "%s-%s"
                toFieldPath: spec.forProvider.manifest.metadata.namespace
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.labels[crossplane.io/claim-namespace]
                    - fromFieldPath: metadata.labels[crossplane.io/claim-name]
                  strategy: string
                  string:
                    fmt: "%s-%s.kubesandbox.com"
                toFieldPath: spec.forProvider.manifest.spec.hostnames[0]
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
