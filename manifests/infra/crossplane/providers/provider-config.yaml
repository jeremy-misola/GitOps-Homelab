apiVersion: tf.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: terraform-config
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  configuration:
    # Terraform will run in-cluster and requires credentials for external providers
    # Authentik credentials are injected via environment variables
  credentials:
    - filename: authentik-token
      source: Secret
      secretRef:
        namespace: crossplane-system
        name: authentik-api-token
        key: token