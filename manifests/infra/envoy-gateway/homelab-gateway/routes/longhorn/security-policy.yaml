apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: longhorn-oidc-config
  namespace: longhorn-system
  annotations:
    # Crossplane creates the secret, so we need to ensure it exists first
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: longhorn-route
  oidc:
    provider:
      issuer: "https://auth.jeremymr.dev/application/o/longhorn/"
    # Client ID and Secret are managed by Crossplane Workspace
    # The secret is created by: manifests/infra/crossplane/workspaces/longhorn-auth.yaml
    # Secret keys must be "client-id" and "client-secret" (hyphens, not underscores)
    clientIDRef:
      name: longhorn-client-secret
    clientSecret:
      name: longhorn-client-secret
    redirectURL: "https://longhorn.jeremymr.dev/oauth2/callback"
    logoutPath: "/logout"
