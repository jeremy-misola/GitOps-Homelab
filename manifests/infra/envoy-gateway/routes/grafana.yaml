apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
  namespace: monitoring
spec:
  parentRefs:
  - name: prod-web
    namespace: envoy-gateway-system
  hostnames:
    - grafana.jeremymr.dev
  rules:
  - backendRefs:
    - name: kube-prometheus-grafana
      port: 80