apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: devdocs-oidc-config
  namespace: backstage
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: backstage-route
  oidc:
    provider:
      issuer: "https://auth.jeremymr.dev/application/o/devdocs/"
    # Client ID and Secret are managed by Crossplane Workspace
    # The secret is created by: manifests/infra/crossplane/workspaces/devdocs-auth.yaml
    # Secret keys must be "client-id" and "client-secret" (hyphens, not underscores)
    clientIDRef:
      name: devdocs-client-secret
    clientSecret:
      name: devdocs-client-secret
    redirectURL: "https://devdocs.jeremymr.dev/oauth2/callback"
    logoutPath: "/logout"
