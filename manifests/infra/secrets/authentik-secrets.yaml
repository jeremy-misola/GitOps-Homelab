apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-secret-store 
    kind: ClusterSecretStore
  target:
    name: authentik-secrets
    creationPolicy: Owner
  data:
  # Core secrets
  - secretKey: AUTHENTIK_SECRET_KEY
    remoteRef:
      key: AUTHENTIK_SECRET_KEY

  # PostgreSQL password - Key for bundled PostgreSQL chart
  - secretKey: POSTGRESQL_PASSWORD
    remoteRef:
      key: DB_PASSWORD 

  # PostgreSQL password - Authentik app expects this env var name
  - secretKey: AUTHENTIK_POSTGRESQL__PASSWORD
    remoteRef:
      key: DB_PASSWORD 

  # Redis password - Key for bundled Redis chart
  - secretKey: REDIS_PASSWORD
    remoteRef:
      key: REDIS_PASSWORD

  # Redis password - Authentik app expects this env var name
  - secretKey: AUTHENTIK_REDIS__PASSWORD
    remoteRef:
      key: REDIS_PASSWORD

  # Bootstrap configuration - creates admin account and API token on first run
  # Note: Keys must match the exact env var names expected by Authentik when using global.envFrom
  - secretKey: AUTHENTIK_BOOTSTRAP_PASSWORD
    remoteRef:
      key: AUTHENTIK_BOOTSTRAP_PASSWORD

  - secretKey: AUTHENTIK_BOOTSTRAP_TOKEN
    remoteRef:
      key: AUTHENTIK_BOOTSTRAP_TOKEN

  - secretKey: AUTHENTIK_BOOTSTRAP_EMAIL
    remoteRef:
      key: AUTHENTIK_BOOTSTRAP_EMAIL

  # Email configuration (SMTP) - Authentik expects AUTHENTIK_EMAIL__ prefix
  - secretKey: AUTHENTIK_EMAIL__HOST
    remoteRef:
      key: SMTP_HOST

  - secretKey: AUTHENTIK_EMAIL__PORT
    remoteRef:
      key: SMTP_PORT

  - secretKey: AUTHENTIK_EMAIL__USERNAME
    remoteRef:
      key: SMTP_USERNAME

  - secretKey: AUTHENTIK_EMAIL__PASSWORD
    remoteRef:
      key: SMTP_PASSWORD
