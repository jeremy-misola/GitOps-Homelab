apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler-secret-store 
    kind: ClusterSecretStore
  target:
    name: authentik-secrets
    creationPolicy: Owner
  data:
  # Core secrets
  - secretKey: AUTHENTIK_SECRET_KEY
    remoteRef:
      key: AUTHENTIK_SECRET_KEY

  - secretKey: POSTGRESQL_PASSWORD
    remoteRef:
      key: DB_PASSWORD 

  - secretKey: REDIS_PASSWORD
    remoteRef:
      key: REDIS_PASSWORD

  # Bootstrap configuration - creates admin account and API token on first run
  # Note: Keys must match the exact env var names expected by Authentik when using global.envFrom
  - secretKey: AUTHENTIK_BOOTSTRAP_PASSWORD
    remoteRef:
      key: AUTHENTIK_BOOTSTRAP_PASSWORD

  - secretKey: AUTHENTIK_BOOTSTRAP_TOKEN
    remoteRef:
      key: AUTHENTIK_BOOTSTRAP_TOKEN

  - secretKey: AUTHENTIK_BOOTSTRAP_EMAIL
    remoteRef:
      key: AUTHENTIK_BOOTSTRAP_EMAIL

  # Email configuration (SMTP)
  - secretKey: SMTP_HOST
    remoteRef:
      key: SMTP_HOST

  - secretKey: SMTP_PORT
    remoteRef:
      key: SMTP_PORT

  - secretKey: SMTP_USERNAME
    remoteRef:
      key: SMTP_USERNAME

  - secretKey: SMTP_PASSWORD
    remoteRef:
      key: SMTP_PASSWORD
