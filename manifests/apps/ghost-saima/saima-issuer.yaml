  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-saima
    solvers:
    - dns01:
        cloudflare:
          email: misolarellinj06@gmail.com
          apiTokenSecretRef:
            name: saima-cloudflare-api-token-secret
            key: api-token
