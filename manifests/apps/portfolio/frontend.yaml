apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: portfolio
  labels:
    app: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      securityContext:
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: frontend
              topologyKey: kubernetes.io/hostname
      imagePullSecrets:
      - name: acr-creds
      containers:
      - name: frontend
        image: kleff.azurecr.io/portfolio:v1.0.0
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        ports:
        - containerPort: 3000
          name: http
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        
        # Database environment variables from CNPG cluster secret
        env:
        - name: DATABASE_HOST
          value: "postgres-db"       # Points to the Service name
        - name: DATABASE_PORT
          value: "5432"              # Default Postgres port
        - name: DATABASE_NAME
          value: "portfolio_db"      # Matches POSTGRES_DB in the StatefulSet
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: portfolio-db-app
              key: username
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: portfolio-db-app
              key: password
              
        # Admin credentials from ExternalSecret
        - name: ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: portfolio-admin-secrets
              key: ADMIN_USERNAME
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: portfolio-admin-secrets
              key: ADMIN_PASSWORD
        - name: ADMIN_SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: portfolio-admin-secrets
              key: ADMIN_SESSION_SECRET
        
        # Resource limits
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: tmp
        emptyDir: {}
