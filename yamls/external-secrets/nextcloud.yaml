apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-secret
  namespace: nextcloud-aio
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-auth-api

  target:
    name: nextcloud-creds

  data:
    - secretKey: values.yaml
      remoteRef:
        key: NEXTCLOUD_VALUES
