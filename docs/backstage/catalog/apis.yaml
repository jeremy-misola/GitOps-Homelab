apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: garage-s3-api
  description: S3-compatible object storage API
  tags:
    - storage
    - s3
    - object-storage
spec:
  type: openapi
  lifecycle: production
  owner: team-platform
  system: storage-database
  definition: |
    openapi: 3.0.1
    info:
      title: Garage S3 API
      version: 1.0.0
      description: S3-compatible object storage API for storing and retrieving objects
    servers:
      - url: https://garage.garage.svc.cluster.local:3900
    paths:
      /{bucket}:
        get:
          summary: List Objects
          description: List all objects in a bucket
        put:
          summary: Create Bucket
          description: Create a new bucket
      /{bucket}/{key}:
        get:
          summary: Get Object
          description: Retrieve an object from a bucket
        put:
          summary: Put Object
          description: Store an object in a bucket
        delete:
          summary: Delete Object
          description: Delete an object from a bucket

