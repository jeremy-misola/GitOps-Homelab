apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: cloudnativepg-api
  description: CloudNativePG PostgreSQL database API
  tags:
    - database
    - postgresql
    - kubernetes
spec:
  type: openapi
  lifecycle: production
  owner: team-platform
  system: storage-database
  definition: |
    openapi: 3.0.1
    info:
      title: CloudNativePG API
      version: 1.0.0
      description: PostgreSQL database service for applications
    servers:
      - url: postgresql://cluster-rw.cloudnativepg.svc.cluster.local:5432
    paths:
      /databases:
        get:
          summary: List Databases
          description: List all available databases
      /query:
        post:
          summary: Execute Query
          description: Execute SQL queries against the database