apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: authentik-oidc
  description: OIDC authentication API for single sign-on
  tags:
    - authentication
    - oidc
    - sso
spec:
  type: openapi
  lifecycle: production
  owner: team-platform
  system: platform-infrastructure
  definition: |
    openapi: 3.0.1
    info:
      title: Authentik OIDC API
      version: 1.0.0
      description: OIDC authentication endpoints for SSO integration
    servers:
      - url: https://auth.jeremymr.dev/application/o
    paths:
      /{application}/.well-known/openid-configuration:
        get:
          summary: OpenID Connect Discovery
          description: Returns the OpenID Connect discovery document for the application
          parameters:
            - name: application
              in: path
              required: true
              schema:
                type: string
          responses:
            '200':
              description: OpenID configuration document
      /{application}/authorize/:
        get:
          summary: Authorization Endpoint
          description: OIDC authorization endpoint
      /{application}/token/:
        post:
          summary: Token Endpoint
          description: OIDC token endpoint for exchanging authorization codes

