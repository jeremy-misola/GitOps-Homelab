apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: ghost-api
  description: Ghost CMS Content API for blog management
  tags:
    - cms
    - blog
    - content
spec:
  type: openapi
  lifecycle: production
  owner: team-platform
  system: applications
  definition: |
    openapi: 3.0.1
    info:
      title: Ghost Content API
      version: 4.0.0
      description: Ghost CMS Content API for retrieving posts, pages, and tags
    servers:
      - url: https://ghost.jeremymr.dev/ghost/api/v4/admin
    paths:
      /posts:
        get:
          summary: List Posts
          description: Retrieve a list of blog posts
      /pages:
        get:
          summary: List Pages
          description: Retrieve a list of static pages
      /tags:
        get:
          summary: List Tags
          description: Retrieve a list of tags

