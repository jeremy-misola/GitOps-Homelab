apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: argocd-api
  description: ArgoCD GitOps API for managing applications and clusters
  tags:
    - gitops
    - kubernetes
    - continuous-delivery
spec:
  type: openapi
  lifecycle: production
  owner: team-platform
  system: platform-infrastructure
  definition: |
    openapi: 3.0.1
    info:
      title: ArgoCD API
      version: 1.0.0
      description: ArgoCD REST API for GitOps operations
    servers:
      - url: https://argocd.jeremymr.dev/api/v1
    paths:
      /applications:
        get:
          summary: List Applications
          description: List all ArgoCD applications
      /clusters:
        get:
          summary: List Clusters
          description: List all connected Kubernetes clusters

