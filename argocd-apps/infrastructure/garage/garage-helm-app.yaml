name: garage
namespace: garage
syncWave: "7"
repoURL: https://datahub-local.github.io/garage-helm
chart: garage
targetRevision: 0.2.1
values: |
  fullnameOverride: "garage"

  garage:
    secret:
      create: false
      name: garage-admin-credentials

  clusterConfig:
    enabled: true
    layout:
      enabled: true
      zone: dc1
      capacity: "10Gi"

  # Buckets and keys are now managed via Crossplane
  # See manifests/infra/crossplane/workspaces/garage-loki-buckets.yaml
