name: loki-stack
namespace: loki
syncWave: "13"
repoURL: https://grafana.github.io/helm-charts
chart: loki
targetRevision: 6.49.0
values: |
  loki:
    commonConfig:
      replication_factor: 3
    write:
      replicas: 3
    
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    storage:
      type: s3
      bucketNames:
        chunks: loki-chunks
        ruler: loki-ruler
        admin: loki-admin
      s3:
        endpoint: garage.garage.svc.cluster.local:3900 
        region: garage
        accessKeyId: ${S3_ACCESS_KEY}
        secretAccessKey: ${S3_SECRET_KEY}
        s3ForcePathStyle: true
        insecure: true

  write:
    replicas: 3
    extraArgs: ["-config.expand-env=true"]
    extraEnv: &lokiEnv
      - name: S3_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: loki-s3-credentials
            key: access-key-id
      - name: S3_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: loki-s3-credentials
            key: secret-access-key
  read:
    replicas: 3
    affinity: {}
    extraArgs: ["-config.expand-env=true"]
    extraEnv: *lokiEnv
  backend:
    replicas: 3
    affinity: {}
    extraArgs: ["-config.expand-env=true"]
    extraEnv: *lokiEnv