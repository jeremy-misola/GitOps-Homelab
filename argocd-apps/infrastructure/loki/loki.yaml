apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.53.0
    helm:
      values: |
        loki:
          # Configuration for the Loki binary itself
          commonConfig:
            replication_factor: 1
          write:
            replicas: 1
          
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h

          storage:
            type: s3
            bucketNames:
              chunks: loki-chunks
              ruler: loki-ruler
              admin: loki-admin
            s3:
              endpoint: garage.garage.svc.cluster.local:3900 
              region: garage
              accessKeyId: ${S3_ACCESS_KEY}
              secretAccessKey: ${S3_SECRET_KEY}
              s3ForcePathStyle: true
              insecure: true

        # Injecting Secrets into all components (Read, Write, Backend)
        write:
          replicas: 1
          extraArgs: ["-config.expand-env=true"]
          extraEnv: &lokiEnv
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-loki-secrets
                  key: access-key-id
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-loki-secrets
                  key: secret-access-key
        read:
          replicas: 1
          affinity: {}
          extraArgs: ["-config.expand-env=true"]
          extraEnv: *lokiEnv
        backend:
          replicas: 1
          affinity: {}
          extraArgs: ["-config.expand-env=true"]
          extraEnv: *lokiEnv

  destination:
    server: https://kubernetes.default.svc
    namespace: loki
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true