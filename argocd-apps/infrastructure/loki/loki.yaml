apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.49.0
    helm:
      values: |
        loki:
          schemaConfig:
            configs:
              - from: "2024-01-01" # This can be any date in the past
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          storage:
            type: s3
            bucketNames:
              chunks: loki-chunks
              ruler: loki-ruler
              admin: loki-admin
            s3:
              endpoint: garage.garage.svc.cluster.local:3900 
              
              region: garage           # Garage usually ignores this, but a value is required
              secretName: "garage-loki-secrets"
              
              s3ForcePathStyle: true   # REQUIRED for Garage
              insecure: true           # Set to 'true' if your Garage endpoint is http (not https)
  destination:
    server: https://kubernetes.default.svc
    namespace: loki
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true