apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns
    chart: external-dns
    targetRevision: 1.20.0
    helm:
      values: |
        provider: cloudflare

        policy: sync
        
        registry: txt
        txtOwnerId: paas-cluster

        domainFilters:
          - kleff.io
        
        serviceAccount:
          create: true
          name: external-dns
        rbac:
          create: true
        sources:
          - gateway-httproute
          - gateway-gateway

        env:
        - name: CF_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflare-api-token-kleff
              key: api-token

  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true