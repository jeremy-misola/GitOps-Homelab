name: authentik
namespace: authentik
syncWave: "10"
repoURL: https://charts.goauthentik.io/
chart: authentik
targetRevision: 2025.10.3
values: |
  authentik:
    secret_key: ""
    
    # Disable chart-managed passwords
    postgresql:
      password: ""
    redis:
      password: ""

  server:
    env:
      # Core secrets
      - name: AUTHENTIK_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: authentik-secrets
            key: AUTHENTIK_SECRET_KEY
      - name: AUTHENTIK_POSTGRESQL__PASSWORD
        valueFrom:
          secretKeyRef:
            name: authentik-secrets
            key: POSTGRESQL_PASSWORD
      - name: AUTHENTIK_REDIS__PASSWORD
        valueFrom:
          secretKeyRef:
            name: authentik-secrets
            key: REDIS_PASSWORD
      
      # Bootstrap configuration - creates admin account and token on first run
      - name: AUTHENTIK_BOOTSTRAP_EMAIL
        value: "admin@jeremymr.dev"
      - name: AUTHENTIK_BOOTSTRAP_PASSWORD
        valueFrom:
          secretKeyRef:
            name: authentik-secrets
            key: BOOTSTRAP_PASSWORD
      - name: AUTHENTIK_BOOTSTRAP_TOKEN
        valueFrom:
          secretKeyRef:
            name: authentik-secrets
            key: BOOTSTRAP_TOKEN
      
      # Email configuration
      - name: AUTHENTIK_EMAIL__HOST
        valueFrom:
          secretKeyRef:
            name: authentik-secrets
            key: SMTP_HOST
      - name: AUTHENTIK_EMAIL__PORT
        valueFrom:
          secretKeyRef:
            name: authentik-secrets
            key: SMTP_PORT
      - name: AUTHENTIK_EMAIL__USERNAME
        valueFrom:
          secretKeyRef:
            name: authentik-secrets
            key: SMTP_USERNAME
      - name: AUTHENTIK_EMAIL__PASSWORD
        valueFrom:
          secretKeyRef:
            name: authentik-secrets
            key: SMTP_PASSWORD
      - name: AUTHENTIK_EMAIL__USE_TLS
        value: "true"
      - name: AUTHENTIK_EMAIL__FROM
        value: "authentik@jeremymr.dev"

  worker:
    env:
      # Core secrets
      - name: AUTHENTIK_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: authentik-secrets
            key: AUTHENTIK_SECRET_KEY
      - name: AUTHENTIK_POSTGRESQL__PASSWORD
        valueFrom:
          secretKeyRef:
            name: authentik-secrets
            key: POSTGRESQL_PASSWORD
      - name: AUTHENTIK_REDIS__PASSWORD
        valueFrom:
          secretKeyRef:
            name: authentik-secrets
            key: REDIS_PASSWORD
      
      # Email configuration (worker sends emails)
      - name: AUTHENTIK_EMAIL__HOST
        valueFrom:
          secretKeyRef:
            name: authentik-secrets
            key: SMTP_HOST
      - name: AUTHENTIK_EMAIL__PORT
        valueFrom:
          secretKeyRef:
            name: authentik-secrets
            key: SMTP_PORT
      - name: AUTHENTIK_EMAIL__USERNAME
        valueFrom:
          secretKeyRef:
            name: authentik-secrets
            key: SMTP_USERNAME
      - name: AUTHENTIK_EMAIL__PASSWORD
        valueFrom:
          secretKeyRef:
            name: authentik-secrets
            key: SMTP_PASSWORD
      - name: AUTHENTIK_EMAIL__USE_TLS
        value: "true"
      - name: AUTHENTIK_EMAIL__FROM
        value: "authentik@jeremymr.dev"

  postgresql:
    enabled: true
    auth:
      existingSecret: "authentik-secrets"
      secretKeys:
        # Map the keys defined in your ExternalSecret
        adminPasswordKey: "POSTGRESQL_PASSWORD"
        userPasswordKey: "POSTGRESQL_PASSWORD"

  redis:
    enabled: true
    auth:
      enabled: true
      existingSecret: "authentik-secrets"
      existingSecretPasswordKey: "REDIS_PASSWORD"