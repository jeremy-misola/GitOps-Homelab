name: blackbox-exporter
namespace: monitoring
syncWave: "10"
repoURL: https://prometheus-community.github.io/helm-charts
chart: prometheus-blackbox-exporter
targetRevision: 11.7.0
values: |
  releaseLabel: true
  serviceMonitor:
    enabled: true
    defaults:
      labels:
        release: kube-prometheus
    targets:
    - name: argocd
      url: http://argocd.jeremymr.dev/healthz
      interval: 60s
      scrapeTimeout: 60s
      module: http_2xx
    - name: kleff
      url: https://kleff.io
      interval: 60s
      scrapeTimeout: 60s
      module: http_2xx