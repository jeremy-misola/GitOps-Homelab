apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ghost
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    path: .
    repoURL: oci://registry-1.docker.io/cloudpirates/ghost
    targetRevision: 0.6.4
    helm:
      values: |
        extraEnvVars:
        - name: url
          value: "https://ghost.jeremymr.dev"
        - name: admin__url
          value: "https://ghost-admin.jeremymr.dev"
        # Gmail SMTP Configuration
        - name: mail__transport
          value: "SMTP"
        - name: mail__from
          value: "misolarellinj06@gmail.com"
        - name: mail__options__service
          value: "Gmail"
        - name: mail__options__auth__user
          value: "misolarellinj06@gmail.com"
        - name: mail__options__auth__pass
          valueFrom:
            secretKeyRef:
              name: gmail-app-password
              key: app-password
  destination:
    server: https://kubernetes.default.svc
    namespace: ghost
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true