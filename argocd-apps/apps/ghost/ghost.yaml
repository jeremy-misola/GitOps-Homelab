apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ghost
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    path: .
    repoURL: oci://registry-1.docker.io/cloudpirates/ghost
    targetRevision: 0.6.4
    helm:
      values: |
        extraEnvVars:
        - name: url
          value: "https://ghost.jeremymr.dev"
        - name: admin__url
          value: "https://ghost-admin.jeremymr.dev"
  destination:
    server: https://kubernetes.default.svc
    namespace: ghost
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true