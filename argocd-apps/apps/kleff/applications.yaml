apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kleff-deployment
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  project: default
  source:
    repoURL: https://github.com/jeremy-misola/GitOps-Homelab
    targetRevision: develop
    path: charts/kleff
    directory:
      recurse: true       
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true