apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: kleff.azurecr.io/helm
    chart: operator
    targetRevision: 0.1.0
    helm:
      values: |
        manager:
          image:
            repository: kleff.azurecr.io/webapp-operator
            tag: latest
            pullPolicy: Always
          imagePullSecrets:
            - name: acr-creds
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true